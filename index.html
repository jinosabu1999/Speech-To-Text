<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0c0a09] text-stone-200 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
  <meta name="theme-color" content="#0c0a09">
  <title>VocalScribe - Speech to Text</title>
  
  <!-- Tailwind V4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand: #f59e0b; /* Amber 500 */
      --brand-glow: rgba(245, 158, 11, 0.4);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.4);
      --surface: rgba(28, 25, 23, 0.85); /* Stone 900 */
    }
    
    body {
      font-family: "Inter", system-ui, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    .mono { font-family: "JetBrains Mono", monospace; }
    
    /* Elegant Scrollbars */
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    /* Keyframe Animations */
    @keyframes mic-pulse { 
      0% { transform: scale(1); opacity: 0.6; } 
      100% { transform: scale(2.2); opacity: 0; } 
    }
    @keyframes mic-glow { 
      0%, 100% { box-shadow: 0 0 15px 2px var(--brand-glow); } 
      50% { box-shadow: 0 0 35px 8px var(--brand-glow); } 
    }
    @keyframes rec-glow { 
      0%, 100% { box-shadow: 0 0 20px 4px var(--danger-glow); } 
      50% { box-shadow: 0 0 45px 12px var(--danger-glow); } 
    }
    @keyframes slide-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scale-in { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-16px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .mic-ring { animation: mic-pulse 2s cubic-bezier(0.2, 0, 0.2, 1) infinite; }
    .mic-glow { animation: mic-glow 2.5s ease-in-out infinite; }
    .rec-glow { animation: rec-glow 2s ease-in-out infinite; }
    .meter-bar { transform-origin: bottom; transition: height 80ms ease-out; }
    
    .toast-in { animation: toast-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .fade-in { animation: fade-in 0.25s ease-out both; }
    .slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .scale-in { animation: scale-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Editor Specifics */
    #transcript { caret-color: var(--brand); line-height: 1.75; }
    
    /* Layout utilities */
    .pb-safe { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    .pt-safe-top { padding-top: max(0rem, env(safe-area-inset-top)); }

    /* Print Styles */
    @media print {
      body { background: white !important; color: black !important; overflow: visible !important; }
      #app, #toastRegion, .modal-layer, #controlDock { display: none !important; }
      #printDocument { display: block !important; padding: 0.5in; font-family: serif; }
      #printDocument h1 { font-size: 24pt; margin-bottom: 8pt; border-bottom: 1px solid #ddd; padding-bottom: 8px;}
      #printDocument .print-date { color: #666; font-size: 11pt; margin-bottom: 24pt; font-family: sans-serif; }
      #printDocument .print-body { white-space: pre-wrap; font-size: 12pt; line-height: 1.6; }
    }
  </style>
</head>
<body class="h-full overflow-hidden">

  <!-- Toasts -->
  <div id="toastRegion" class="pointer-events-none fixed left-4 right-4 top-4 z-[100] flex flex-col items-center gap-3 sm:left-auto sm:right-6 sm:w-80" aria-live="polite"></div>

  <!-- Main App Shell -->
  <div id="app" class="flex h-[100dvh] w-full flex-col overflow-hidden bg-[#0c0a09] selection:bg-amber-500/30">
    
    <!-- Top Header -->
    <header id="appHeader" class="pt-safe-top flex h-[72px] shrink-0 items-center justify-between px-4 sm:px-6 z-30">
      <div class="flex flex-1 min-w-0 items-center gap-3">
        <input id="noteTitle" class="w-full bg-transparent text-xl font-bold text-stone-100 placeholder:text-stone-600 outline-none truncate transition-colors focus:text-white" maxlength="80" value="Untitled transcript" aria-label="Transcript title" dir="auto">
      </div>
      
      <div class="flex shrink-0 items-center gap-3 ml-4">
        <!-- Status Indicator -->
        <div id="headerStatus" class="flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wide text-stone-300">
          <span id="statusDot" class="h-1.5 w-1.5 rounded-full bg-emerald-500 transition-colors duration-300"></span>
          <span id="statusLabel" class="hidden sm:inline">Ready</span>
        </div>
        
        <!-- Save State -->
        <div class="hidden sm:flex items-center gap-1.5 px-2">
          <span id="saveIndicator" class="hidden h-1.5 w-1.5 rounded-full bg-amber-500"></span>
          <span id="saveState" class="mono text-[10px] font-bold text-stone-500 tracking-widest">DRAFT</span>
        </div>

        <!-- Settings Gear -->
        <button id="settingsButton" class="group flex h-10 w-10 items-center justify-center rounded-full bg-white/5 text-stone-400 transition hover:bg-white/10 hover:text-white" aria-label="Settings">
          <svg class="h-5 w-5 transition-transform group-hover:rotate-45" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke-width="1.8"/></svg>
        </button>
      </div>
    </header>

    <!-- Formatting Toolbar -->
    <div id="editorToolbar" class="no-scrollbar flex shrink-0 items-center gap-2 overflow-x-auto border-y border-white/5 bg-stone-900/40 px-4 py-2 z-20">
      <div class="flex h-8 items-center gap-1 rounded-md bg-stone-950 px-2 shadow-inner border border-stone-800">
        <select id="languageSelect" class="bg-transparent text-[11px] font-semibold text-stone-300 outline-none cursor-pointer uppercase tracking-wider" aria-label="Recognition language">
          <option value="en-US">EN (US)</option>
          <option value="en-GB">EN (UK)</option>
          <option value="en-IN">EN (IN)</option>
          <option value="en-AU">EN (AU)</option>
          <option value="es-ES">ES</option>
          <option value="fr-FR">FR</option>
          <option value="de-DE">DE</option>
          <option value="it-IT">IT</option>
          <option value="pt-BR">PT</option>
          <option value="hi-IN">HI</option>
          <option value="ar-SA">AR</option>
          <option value="zh-CN">ZH</option>
          <option value="ja-JP">JA</option>
          <option value="ko-KR">KO</option>
          <option value="ru-RU">RU</option>
        </select>
      </div>
      
      <div class="h-4 w-px bg-white/10 mx-1 shrink-0"></div>
      
      <button id="undoButton" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-stone-400 transition hover:bg-white/10 hover:text-stone-100" title="Undo">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="redoButton" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-stone-400 transition hover:bg-white/10 hover:text-stone-100" title="Redo">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 7 5 5-5 5M19 12h-8a6 6 0 0 0-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      
      <div class="h-4 w-px bg-white/10 mx-1 shrink-0"></div>
      
      <button id="findButton" class="flex h-8 shrink-0 items-center gap-1.5 rounded-md px-2.5 text-[11px] font-semibold uppercase tracking-wide text-stone-300 transition hover:bg-white/10 hover:text-stone-100">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="6" stroke-width="2"/><path d="m16 16 4 4" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="hidden sm:inline">Find</span>
      </button>
      
      <button id="cleanButton" class="flex h-8 shrink-0 items-center gap-1.5 rounded-md px-2.5 text-[11px] font-semibold uppercase tracking-wide text-amber-400 transition hover:bg-amber-500/10" title="Remove common filler words">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3ZM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z" stroke-width="2" stroke-linejoin="round"/></svg>
        <span class="hidden sm:inline">Clean</span>
      </button>
      
      <div class="ml-auto hidden shrink-0 items-center gap-1 sm:flex">
        <button id="fontDownButton" class="flex h-8 w-8 items-center justify-center rounded-md text-xs font-bold text-stone-400 transition hover:bg-white/10 hover:text-stone-100">A-</button>
        <button id="fontUpButton" class="flex h-8 w-8 items-center justify-center rounded-md text-xs font-bold text-stone-400 transition hover:bg-white/10 hover:text-stone-100">A+</button>
      </div>
    </div>

    <!-- Find & Replace Bar -->
    <div id="findBar" class="hidden shrink-0 grid-cols-[1fr_auto_auto] items-center gap-2 border-b border-amber-500/20 bg-amber-500/5 px-4 py-2 sm:grid-cols-[1fr_1fr_auto_auto]">
      <input id="findInput" class="col-span-3 min-w-0 rounded-md border border-white/10 bg-black/40 px-3 py-1.5 text-xs text-white outline-none focus:border-amber-500 sm:col-span-1" placeholder="Find text">
      <input id="replaceInput" class="min-w-0 rounded-md border border-white/10 bg-black/40 px-3 py-1.5 text-xs text-white outline-none focus:border-amber-500" placeholder="Replace with">
      <button id="replaceButton" class="h-8 shrink-0 rounded-md bg-amber-600 px-3 text-xs font-bold text-stone-950 transition hover:bg-amber-500">Replace all</button>
      <button id="closeFindButton" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-stone-400 transition hover:bg-white/10 hover:text-white">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 6 12 12M18 6 6 18" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- MAIN EDITOR AREA -->
    <main class="flex min-w-0 flex-1 flex-col h-full relative bg-[#0c0a09]">
      
      <!-- Stats Panel Overlay (Desktop mostly) -->
      <div id="statsPanel" class="absolute top-4 right-4 z-10 pointer-events-none hidden sm:flex flex-col items-end gap-1 opacity-50 transition-opacity duration-300">
        <span class="text-xs text-stone-400"><strong id="wordCount" class="mono text-stone-200">0</strong> words</span>
        <span class="text-[10px] text-stone-500"><strong id="charCount" class="mono text-stone-300">0</strong> chars</span>
        <span class="text-[10px] text-stone-500"><strong id="sentenceCount" class="mono text-stone-300">0</strong> sents</span>
        <span class="text-[10px] text-stone-500 mt-1 bg-white/5 px-1.5 rounded"><strong id="readingTime" class="mono text-amber-400">0m</strong> read</span>
      </div>

      <!-- Text Editor -->
      <textarea id="transcript" class="custom-scroll absolute inset-0 h-full w-full resize-none bg-transparent px-5 py-6 text-[17px] text-stone-100 outline-none sm:px-8 sm:py-8 pb-40 md:pb-32 placeholder:text-stone-700" spellcheck="true" placeholder="Tap the microphone to start speaking.&#10;&#10;Your transcript will appear here in real time." aria-label="Transcript editor" dir="auto"></textarea>
      
      <!-- Live Transcription Bubble -->
      <div id="interimBubble" class="pointer-events-none absolute bottom-36 left-1/2 -translate-x-1/2 w-[90%] max-w-lg hidden z-10 slide-up" aria-live="polite">
        <div class="flex items-center gap-3 rounded-2xl bg-[#1c1917]/95 px-5 py-3.5 text-sm shadow-2xl backdrop-blur-xl border border-white/10 ring-1 ring-amber-500/20">
          <span class="h-2 w-2 shrink-0 animate-pulse rounded-full bg-amber-400"></span>
          <span id="interimText" class="truncate italic text-stone-200"></span>
        </div>
      </div>

      <!-- Mobile Inline Stats (Hidden visually but kept for JS hooks) -->
      <div id="mobileStats" class="hidden">
        <span id="mobileWords"></span><span id="mobileChars"></span><span id="mobileRead"></span>
      </div>
      <!-- Support message (Hidden visually but kept for JS hooks) -->
      <p id="supportMessage" class="hidden"></p>
    </main>

    <!-- FLOATING DYNAMIC DOCK -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none z-40 pb-safe px-4">
      <nav id="controlDock" class="pointer-events-auto flex items-center gap-1 sm:gap-3 px-3 sm:px-5 py-2.5 bg-[#1c1917]/85 backdrop-blur-2xl border border-white/10 rounded-full shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
        
        <!-- Dock Left: Notes & Save -->
        <button id="notesButton" class="group relative flex h-11 w-11 items-center justify-center rounded-full text-stone-400 transition hover:bg-white/10 hover:text-stone-100" aria-label="Open saved notes">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="noteCountBadge" class="absolute right-0 top-0 hidden min-w-4 rounded-full bg-amber-500 px-1 text-center text-[9px] font-bold text-stone-950 shadow ring-2 ring-[#1c1917]">0</span>
        </button>
        
        <button id="saveButton" class="flex h-11 w-11 items-center justify-center rounded-full text-stone-400 transition hover:bg-white/10 hover:text-stone-100" aria-label="Save note">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 21 17 13 7 13 7 21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7 3 7 8 15 8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <!-- Dock Center: Giant Mic Button -->
        <div class="relative mx-1 sm:mx-3 flex flex-col items-center justify-center">
          <!-- Level Meter Waveform floating above mic -->
          <div id="levelMeter" class="absolute -top-8 flex h-6 w-full items-end justify-center gap-1 opacity-0 transition-opacity duration-300 pointer-events-none" aria-hidden="true">
            <span class="meter-bar w-[3px] rounded-full bg-orange-400" style="height:4px;"></span>
            <span class="meter-bar w-[3px] rounded-full bg-amber-400" style="height:8px;"></span>
            <span class="meter-bar w-[3px] rounded-full bg-yellow-400" style="height:12px;"></span>
            <span class="meter-bar w-[3px] rounded-full bg-amber-400" style="height:8px;"></span>
            <span class="meter-bar w-[3px] rounded-full bg-orange-400" style="height:4px;"></span>
          </div>
          
          <div id="micPulse" class="mic-ring absolute inset-0 hidden h-full w-full rounded-full bg-amber-500/40 pointer-events-none"></div>
          
          <!-- Mic is larger and visually pops out of the dock -->
          <button id="recordButton" class="relative z-10 flex h-14 w-14 sm:h-16 sm:w-16 items-center justify-center rounded-full text-stone-950 bg-gradient-to-br from-amber-400 to-orange-600 shadow-[0_4px_20px_rgba(234,88,12,0.4)] border-4 border-[#1c1917] transition-all duration-300 hover:scale-[1.05] active:scale-[0.93] disabled:opacity-50" aria-label="Start listening" aria-pressed="false">
            <svg id="micIcon" class="h-6 w-6 sm:h-7 sm:w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Z" stroke-width="2" stroke-linecap="round"/><path d="M19 10.5v.5a7 7 0 0 1-14 0v-.5M12 18v3M9 21h6" stroke-width="2" stroke-linecap="round"/></svg>
            <svg id="stopIcon" class="hidden h-6 w-6 sm:h-7 sm:w-7 text-white" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
          </button>
          
          <!-- Tiny hint text underneath -->
          <span id="recordHint" class="absolute top-[110%] whitespace-nowrap text-[9px] font-bold tracking-wider text-stone-500 uppercase">Tap to speak</span>
        </div>

        <!-- Dock Right: Copy & Actions Grid (Replaces 3 dots) -->
        <button id="copyButton" class="flex h-11 w-11 items-center justify-center rounded-full text-stone-400 transition hover:bg-white/10 hover:text-stone-100" aria-label="Copy transcript">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        
        <!-- The Grid Icon -> Actions Modal (Modern 3-dots replacement) -->
        <button id="moreButton" class="flex h-11 w-11 items-center justify-center rounded-full text-stone-400 transition hover:bg-white/10 hover:text-stone-100" aria-label="More actions">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke-width="2"/></svg>
        </button>
        
        <!-- Hidden button hook for JS compatibility -->
        <button id="readButton" class="hidden"></button>
      </nav>
    </div>
  </div>

  <!-- OVERLAYS & MODALS -->
  <div id="backdrop" class="modal-layer fixed inset-0 hidden fade-in bg-black/70 backdrop-blur-sm transition-opacity z-50"></div>

  <!-- Notes Drawer (Side sheet) -->
  <aside id="notesDrawer" class="modal-layer fixed bottom-0 right-0 top-0 flex w-full md:w-[420px] translate-x-full flex-col border-l border-white/5 bg-[#12100e] shadow-2xl transition-transform duration-300 ease-out z-[60]" aria-hidden="true">
    <div class="flex h-[72px] shrink-0 pt-safe-top items-center justify-between border-b border-white/5 px-6 bg-white/5">
      <div>
        <h2 class="text-lg font-bold text-stone-100">Saved Notes</h2>
        <p id="notesSubtitle" class="text-[11px] text-stone-400">Local browser storage</p>
      </div>
      <button data-close-overlay class="flex h-10 w-10 items-center justify-center rounded-full bg-white/5 text-stone-400 transition hover:bg-white/10 hover:text-white">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 6 12 12M18 6 6 18" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    
    <div class="space-y-3 border-b border-white/5 p-5 bg-[#12100e]">
      <div class="flex gap-2">
        <div class="relative flex-1">
          <svg class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-500" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="notesSearch" class="w-full rounded-xl border border-white/10 bg-black/40 pl-9 pr-4 py-2.5 text-sm text-stone-100 placeholder:text-stone-600 outline-none focus:border-amber-500 transition-all" placeholder="Search notes...">
        </div>
        <button id="notesSelectToggle" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-stone-400 transition hover:bg-white/10 hover:text-stone-100" title="Select notes">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h10" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="flex gap-2">
        <select id="notesSort" class="flex-1 rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-[11px] font-semibold text-stone-300 outline-none cursor-pointer">
          <option value="updated-desc">Newest first</option>
          <option value="updated-asc">Oldest first</option>
          <option value="title-asc">A → Z</option>
          <option value="title-desc">Z → A</option>
          <option value="words-desc">Longest first</option>
        </select>
        <select id="notesFolderFilter" class="flex-1 rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-[11px] font-semibold text-stone-300 outline-none cursor-pointer">
          <option value="">All folders</option>
        </select>
      </div>

  <!-- Print Layout Wrapper -->
  <div id="printDocument">
    <h1 id="printTitle"></h1>
    <div id="printDate" class="print-date"></div>
    <div id="printBody" class="print-body"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const $ = (id) => document.getElementById(id);

      const ui = {
        app: $("app"), transcript: $("transcript"), title: $("noteTitle"), record: $("recordButton"),
        micIcon: $("micIcon"), stopIcon: $("stopIcon"), micPulse: $("micPulse"), levelMeter: $("levelMeter"),
        statusDot: $("statusDot"), statusLabel: $("statusLabel"), recordHint: $("recordHint"),
        interimBubble: $("interimBubble"), interimText: $("interimText"), saveState: $("saveState"), saveIndicator: $("saveIndicator"),
        backdrop: $("backdrop"), notesDrawer: $("notesDrawer"), notesList: $("notesList"),
        settingsModal: $("settingsModal"), actionsModal: $("actionsModal")
      };

      const defaultSettings = { continuous: true, commands: true, sound: true, haptic: true, speechRate: 1 };
      let settings = { ...defaultSettings, ...loadJSON("vocalScribeSettings", {}) };
      let notes = loadJSON("vocalScribeNotes", []);
      if (!Array.isArray(notes)) notes = [];
      notes = notes.map(function (n) {
        if (!("folder" in n)) n.folder = "";
        if (!("tags" in n)) n.tags = [];
        if (!("pinned" in n)) n.pinned = false;
        return n;
      });
      let folders = loadJSON("vocalScribeFolders", []);
      if (!Array.isArray(folders)) folders = [];
      let activeNoteId = null;
      let saveTimer = null;
      let fontSize = 17;
      let isReading = false;

      let notesSortKey = "updated-desc";
      let notesFilterFolder = "";
      let notesFilterTag = "";
      let notesSelectMode = false;
      let notesSelectedIds = new Set();

      let recognition = null;
      let wantsToListen = false;
      let recognitionRunning = false;
      let startPending = false;
      let restartTimer = null;
      let cycleId = 0;
      let handledFinalResults = new Set();
      let recentFinals = [];
      let audioStream = null;
      let audioContext = null;
      let analyser = null;
      let meterFrame = null;
      let fatalRecognitionError = false;
      let listeningSessionActive = false;
      let restartAttempts = 0;
      const MAX_RESTART_ATTEMPTS = 8;

      applySettingsToUI();
      restoreDraft();
      renderNotes();
      refreshFolderFilter();
      updateStats();

      if (!SpeechRecognition) {
        ui.record.disabled = true;
        setStatus("Unsupported", "error");
        if($("supportMessage")) $("supportMessage").textContent = "Use Chrome, Edge, or Safari with speech recognition";
        showToast("This browser does not provide the Web Speech Recognition API.", "error");
      } else {
        createRecognition();
      }

      function loadJSON(key, fallback) {
        try {
          const value = JSON.parse(localStorage.getItem(key));
          return value ?? fallback;
        } catch {
          return fallback;
        }
      }

      function showToast(message, type = "info") {
        const toast = document.createElement("div");
        const color = type === "error" ? "border-red-500/30 bg-red-950/95 text-red-200" : type === "success" ? "border-emerald-500/30 bg-emerald-950/95 text-emerald-200" : "border-white/10 bg-[#1c1917]/95 text-stone-200";
        toast.className = `toast-in pointer-events-auto w-full rounded-2xl border px-5 py-3.5 text-sm font-semibold shadow-2xl backdrop-blur-xl ${color}`;
        toast.textContent = message;
        $("toastRegion").appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(-10px)";
          toast.style.transition = "200ms ease";
          setTimeout(() => toast.remove(), 200);
        }, 2800);
      }

      function setStatus(label, state = "ready") {
        if (state === "listening" || state === "starting") { ui.statusDot.classList.add("animate-pulse"); }
        else { ui.statusDot.classList.remove("animate-pulse"); }
        ui.statusLabel.textContent = label;
        const colors = {
          ready: "#10b981", // emerald
          listening: "#ef4444", // red
          starting: "#f59e0b", // amber
          error: "#ef4444"
        };
        ui.statusDot.style.background = colors[state] || colors.ready; 
      }

      function vibrate(pattern = 25) {
        if (settings.haptic && navigator.vibrate) navigator.vibrate(pattern);
      }

      function tone(frequency) {
        if (!settings.sound) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          const ctx = new Ctx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.frequency.value = frequency;
          oscillator.type = "sine";
          gain.gain.setValueAtTime(0.035, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.13);
          oscillator.connect(gain).connect(ctx.destination);
          oscillator.start();
          oscillator.stop(ctx.currentTime + 0.14);
          oscillator.onended = () => ctx.close();
        } catch {}
      }

      function createRecognition() {
        if (!SpeechRecognition) return;
        const engine = new SpeechRecognition();
        recognition = engine;
        engine.lang = $("languageSelect").value;
        engine.continuous = settings.continuous;
        engine.interimResults = true;
        engine.maxAlternatives = 1;

        engine.onstart = () => {
          if (recognition !== engine) {
            try { engine.abort(); } catch {}
            return;
          }
          startPending = false;
          recognitionRunning = true;
          if (!wantsToListen) {
            try { engine.stop(); } catch {}
            return;
          }
          fatalRecognitionError = false;
          restartAttempts = 0;
          cycleId += 1;
          handledFinalResults = new Set();
          setListeningUI(true);
          setStatus("Listening", "listening");
          if (!listeningSessionActive) {
            listeningSessionActive = true;
            tone(720);
            vibrate(35);
          }
        };

        engine.onresult = (event) => {
          if (recognition !== engine) return;
          const interimParts = [];

          for (let index = event.resultIndex; index < event.results.length; index += 1) {
            const result = event.results[index];
            const raw = (result[0]?.transcript || "").trim();
            if (!raw) continue;

            if (result.isFinal) {
              const resultKey = `${cycleId}:${index}`;
              if (handledFinalResults.has(resultKey)) continue;
              handledFinalResults.add(resultKey);
              commitFinalResult(raw);
            } else {
              interimParts.push(raw);
            }
          }

          const interim = interimParts.join(" ").trim();
          ui.interimText.textContent = interim;
          var wasHidden = ui.interimBubble.classList.contains("hidden"); 
          ui.interimBubble.classList.toggle("hidden", !interim); 
          if (interim && wasHidden) ui.interimBubble.classList.add("slide-up");
        };

        engine.onerror = (event) => {
          if (recognition !== engine) return;
          startPending = false;
          const error = event.error;
          if (error === "not-allowed" || error === "service-not-allowed") {
            fatalRecognitionError = true;
            wantsToListen = false;
            showToast("Microphone permission was blocked.", "error");
            setStatus("Mic blocked", "error");
          } else if (error === "audio-capture") {
            fatalRecognitionError = true;
            wantsToListen = false;
            showToast("No microphone input was found.", "error");
            setStatus("No microphone", "error");
          } else if (error === "network") {
            showToast("Speech recognition lost its network service.", "error");
          }
        };

        engine.onend = () => {
          if (recognition !== engine) return;
          recognitionRunning = false;
          startPending = false;
          ui.interimBubble.classList.add("hidden");

          if (wantsToListen && settings.continuous && !fatalRecognitionError) {
            restartAttempts += 1;
            if (restartAttempts > MAX_RESTART_ATTEMPTS) {
              wantsToListen = false;
              listeningSessionActive = false;
              setListeningUI(false);
              setStatus("Ready", "ready");
              stopLevelMeter();
              showToast("Continuous listening paused after repeated errors.", "error");
              return;
            }
            setStatus("Reconnecting", "starting");
            clearTimeout(restartTimer);
            restartTimer = setTimeout(startRecognitionCycle, 320);
          } else {
            wantsToListen = false;
            listeningSessionActive = false;
            setListeningUI(false);
            if (!fatalRecognitionError) setStatus("Ready", "ready");
            stopLevelMeter();
          }
        };
      }

      function normalizedSpeech(text) {
        return text.toLocaleLowerCase().replace(/[\s.,!?;:'"\-—]+/g, " ").replace(/ {2,}/g, " ").trim();
      }

      function commitFinalResult(raw) {
        const now = Date.now();
        const normalized = normalizedSpeech(raw);
        recentFinals = recentFinals.filter((item) => now - item.time < 8000);

        const isDuplicate = recentFinals.some((item) => {
          if (item.text !== normalized) return false;
          const age = now - item.time;
          return age < 2000 || (item.cycle !== cycleId && age < 12000);
        });
        if (isDuplicate) return;

        const subsumedByRecent = recentFinals.some((item) => {
          const age = now - item.time;
          if (age > 3500) return false;
          const itemNorm = item.text;
          if (itemNorm.length > normalized.length && itemNorm.includes(normalized)) return true;
          return false;
        });
        if (subsumedByRecent) return;

        recentFinals.push({ text: normalized, time: now, cycle: cycleId });

        const commandResult = settings.commands ? applySpokenCommands(raw) : { text: raw, stop: false, clear: false };
        if (commandResult.clear) {
          ui.transcript.value = "";
          onTranscriptChanged();
          showToast("Transcript cleared by voice command.");
          return;
        }
        if (commandResult.text) appendTranscript(commandResult.text);
        if (commandResult.stop) stopListening();
      }

      function applySpokenCommands(raw) {
        const exact = raw.toLocaleLowerCase().trim().replace(/[.!?]+$/, "");
        if (exact === "clear transcript" || exact === "clear transcription") return { text: "", clear: true, stop: false };
        if (exact === "stop listening" || exact === "stop recording") return { text: "", clear: false, stop: true };

        let text = raw;
        text = text.replace(/\bnew paragraph\b/gi, "\n\n");
        text = text.replace(/\bnew line\b/gi, "\n");
        text = text.replace(/\b(full stop|period)\b/gi, ".");
        text = text.replace(/\bcomma\b/gi, ",");
        text = text.replace(/\bquestion mark\b/gi, "?");
        text = text.replace(/\bexclamation (mark|point)\b/gi, "!");
        text = text.replace(/[ \t]+([,.!?])[ \t]*/g, "$1 ");
        text = text.replace(/[ \t]*\n[ \t]*/g, "\n");
        text = text.replace(/[ \t]{2,}/g, " ");
        text = text.replace(/^ +| +$/g, "");
        return { text, clear: false, stop: false };
      }

      function appendTranscript(incoming) {
        let current = ui.transcript.value;
        let text = incoming;

        const currentTrimmedEnd = current.replace(/\s+$/, "");
        const textTrimmed = text.replace(/^\s+|\s+$/g, "");
        if (textTrimmed && currentTrimmedEnd) {
          if (currentTrimmedEnd.endsWith(textTrimmed)) return;
          if (currentTrimmedEnd.toLocaleLowerCase().endsWith(textTrimmed.toLocaleLowerCase())) return;

          const recentFinalsTrimmed = recentFinals.map(function (item) { return item.text; });
          for (var ri = recentFinalsTrimmed.length - 1; ri >= 0; ri--) {
            var prev = recentFinalsTrimmed[ri];
            var prevLen = prev.length;
            var incomingLen = textTrimmed.toLocaleLowerCase().length;
            if (prevLen > 2 && prevLen < incomingLen && textTrimmed.toLocaleLowerCase().includes(prev)) {
              var currentLower = currentTrimmedEnd.toLocaleLowerCase();
              if (currentLower.endsWith(prev)) {
                current = currentTrimmedEnd.slice(0, currentTrimmedEnd.length - prevLen);
                current = current.replace(/\s+$/, "");
                var sep = current ? " " : "";
                if (/^[,.!?\n]/.test(text)) sep = "";
                ui.transcript.value = current + sep + text;
                ui.transcript.scrollTop = ui.transcript.scrollHeight;
                onTranscriptChanged();
                return;
              }
            }
          }
        }

        const isSentenceStart = !current.trim() || /[.!?]\s*$/.test(current) || /\n\s*$/.test(current);
        if (isSentenceStart && /^[a-z]/.test(text)) text = text.charAt(0).toUpperCase() + text.slice(1);

        let separator = " ";
        if (!current || /\s$/.test(current) || /^[,.!?\n]/.test(text)) separator = "";
        if (/^[,.!?]/.test(text)) current = current.replace(/\s+$/, "");

        ui.transcript.value = current + separator + text;
        ui.transcript.scrollTop = ui.transcript.scrollHeight;
        onTranscriptChanged();
      }

      async function startListening() {
        if (!SpeechRecognition || wantsToListen || recognitionRunning || startPending) return;
        wantsToListen = true;
        restartAttempts = 0;
        fatalRecognitionError = false;
        setStatus("Starting", "starting");
        ui.recordHint.textContent = "Starting...";

        await startLevelMeter();
        if (!wantsToListen) {
          stopLevelMeter();
          setListeningUI(false);
          return;
        }
        startRecognitionCycle();
      }

      function startRecognitionCycle() {
        if (!recognition || !wantsToListen || recognitionRunning || startPending) return;
        clearTimeout(restartTimer);
        startPending = true;
        try {
          recognition.lang = $("languageSelect").value;
          recognition.continuous = settings.continuous;
          recognition.start();
        } catch (error) {
          startPending = false;
          restartAttempts += 1;
          if (wantsToListen && restartAttempts <= MAX_RESTART_ATTEMPTS) {
            restartTimer = setTimeout(startRecognitionCycle, 450);
          } else if (wantsToListen) {
            wantsToListen = false;
            listeningSessionActive = false;
            setListeningUI(false);
            setStatus("Ready", "ready");
            stopLevelMeter();
            showToast("Unable to start speech recognition. Tap the mic to retry.", "error");
          }
        }
      }

      function stopListening(showMessage = true) {
        if (!wantsToListen && !recognitionRunning && !startPending) return;
        wantsToListen = false;
        restartAttempts = 0;
        clearTimeout(restartTimer);
        ui.interimBubble.classList.add("hidden");
        try {
          if (recognitionRunning || startPending) recognition.stop();
        } catch {}
        recognitionRunning = false;
        startPending = false;
        listeningSessionActive = false;
        setListeningUI(false);
        setStatus("Ready", "ready");
        stopLevelMeter();
        tone(440);
        vibrate(20);
        if (showMessage) showToast("Listening stopped.");
      }

      function setListeningUI(listening) {
        ui.record.setAttribute("aria-pressed", String(listening));
        ui.record.setAttribute("aria-label", listening ? "Stop listening" : "Start listening");
        
        // Custom styling for our amber theme using standard CSS classes
        if(listening) {
            ui.record.classList.remove("bg-gradient-to-br", "from-amber-400", "to-orange-600");
            ui.record.classList.add("bg-red-500", "rec-glow");
            ui.record.style.boxShadow = "0 4px 25px rgba(239,68,68,0.5)";
        } else {
            ui.record.classList.add("bg-gradient-to-br", "from-amber-400", "to-orange-600");
            ui.record.classList.remove("bg-red-500", "rec-glow");
            ui.record.style.boxShadow = "0 4px 20px rgba(234,88,12,0.4)";
        }
        
        ui.micIcon.classList.toggle("hidden", listening);
        ui.stopIcon.classList.toggle("hidden", !listening);
        ui.micPulse.classList.toggle("hidden", !listening);
        ui.levelMeter.classList.toggle("opacity-0", !listening);
        ui.recordHint.textContent = listening ? "Listening…" : "Tap to speak";
        ui.recordHint.classList.toggle("text-red-400", listening);
      }

      async function startLevelMeter() {
        if (!navigator.mediaDevices?.getUserMedia) return;
        try {
          audioStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioContext = new Ctx();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 64;
          audioContext.createMediaStreamSource(audioStream).connect(analyser);
          drawMeter();
        } catch (error) {
          if (error?.name === "NotAllowedError") {
            wantsToListen = false;
            fatalRecognitionError = true;
            setListeningUI(false);
            setStatus("Mic blocked", "error");
            showToast("Microphone permission was denied.", "error");
          }
        }
      }

      function drawMeter() {
        if (!analyser) return;
        const data = new Uint8Array(analyser.frequencyBinCount);
        const bars = [...ui.levelMeter.children];
        const render = () => {
          if (!analyser) return;
          analyser.getByteFrequencyData(data);
          const average = data.reduce((sum, value) => sum + value, 0) / data.length;
          bars.forEach((bar, index) => {
            const variation = data[(index * 3) % data.length] || average;
            bar.style.height = `${Math.max(4, Math.min(24, 4 + variation / 8))}px`;
          });
          meterFrame = requestAnimationFrame(render);
        };
        render();
      }

      function stopLevelMeter() {
        cancelAnimationFrame(meterFrame);
        meterFrame = null;
        analyser = null;
        if (audioStream) audioStream.getTracks().forEach((track) => track.stop());
        audioStream = null;
        if (audioContext && audioContext.state !== "closed") audioContext.close().catch(() => {});
        audioContext = null;
        [...ui.levelMeter.children].forEach((bar, index) => bar.style.height = `${index % 2 ? 8 : 4}px`);
      }

      function restartRecognitionForLanguage() {
        const resume = wantsToListen;
        if (wantsToListen || recognitionRunning || startPending) stopListening(false);
        const oldEngine = recognition;
        recognition = null;
        try { if (oldEngine) oldEngine.abort(); } catch {}
        createRecognition();
        if (resume) setTimeout(startListening, 280);
      }

      function onTranscriptChanged() {
        try {
          updateStats();
          ui.saveState.textContent = "SAVING…";
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveDraft, 450);
        } catch (e) { /* keep UI alive */ }
      }

      function saveDraft() {
        const draft = { title: ui.title.value, text: ui.transcript.value, activeNoteId, updatedAt: Date.now() };
        try {
          localStorage.setItem("vocalScribeDraft", JSON.stringify(draft));
        } catch {
          ui.saveState.textContent = "UNSAVED";
          return;
        }
        ui.saveState.textContent = "SAVED"; 
        ui.saveIndicator.classList.remove("hidden"); 
        setTimeout(function(){ui.saveIndicator.classList.add("hidden")}, 1500);
      }

      function restoreDraft() {
        const draft = loadJSON("vocalScribeDraft", null);
        if (!draft) return;
        ui.title.value = typeof draft.title === "string" ? draft.title : "Untitled transcript";
        ui.transcript.value = typeof draft.text === "string" ? draft.text : "";
        activeNoteId = typeof draft.activeNoteId === "string" ? draft.activeNoteId : null;
      }

      function updateStats() {
        const text = ui.transcript.value;
        const trimmed = text.trim();
        const words = trimmed ? trimmed.split(/\s+/u).length : 0;
        const chars = text.length;
        const sentences = trimmed ? (trimmed.match(/[.!?]+(?=\s|$)/g) || []).length || 1 : 0;
        const minutes = words ? Math.max(1, Math.ceil(words / 220)) : 0;
        $("wordCount").textContent = words;
        $("charCount").textContent = chars;
        $("sentenceCount").textContent = sentences;
        $("readingTime").textContent = `${minutes}m`;
        if($("mobileWords")) $("mobileWords").textContent = words;
        if($("mobileChars")) $("mobileChars").textContent = chars;
        if($("mobileRead")) $("mobileRead").textContent = minutes;
      }

      function saveNote() {
        const text = ui.transcript.value.trim();
        if (!text) return showToast("There is no transcript to save.", "error");
        const now = Date.now();
        const existingIndex = notes.findIndex((note) => note.id === activeNoteId);
        const existing = existingIndex >= 0 ? notes[existingIndex] : null;
        const note = {
          id: activeNoteId || window.crypto?.randomUUID?.() || String(now),
          title: ui.title.value.trim() || "Untitled transcript",
          text: ui.transcript.value,
          folder: existing ? existing.folder : "",
          tags: existing ? existing.tags.slice() : [],
          pinned: existing ? existing.pinned : false,
          createdAt: existing ? existing.createdAt : now,
          updatedAt: now
        };
        activeNoteId = note.id;
        if (existingIndex >= 0) notes[existingIndex] = note;
        else notes.unshift(note);
        persistNotes();
        saveDraft();
        showToast("Note saved on this device.", "success");
        vibrate(30);
      }

      function persistNotes() {
        try {
          localStorage.setItem("vocalScribeNotes", JSON.stringify(notes));
          localStorage.setItem("vocalScribeFolders", JSON.stringify(folders));
        } catch {
          showToast("Browser storage is full or unavailable.", "error");
        }
        renderNotes();
        refreshFolderFilter();
      }

      function escapeHTML(str) {
        if (!str || typeof str !== "string") return "";
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function highlightMatches(text, query) {
        if (!query) return escapeHTML(text);
        var safe = escapeHTML(text);
        try {
          var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          var re = new RegExp("(" + escaped + ")", "gi");
          return safe.replace(re, "<mark class=\"rounded px-0.5 bg-amber-500/40 text-amber-100\">$1</mark>");
        } catch (e) { return safe; }
      }

      function getNoteWordCount(note) {
        var t = (note && note.text) || "";
        return t.trim() ? t.trim().split(/\s+/u).length : 0;
      }

      function safeNote(note) {
        return {
          id: (note && note.id) || "",
          title: (note && typeof note.title === "string") ? note.title : "Untitled",
          text: (note && typeof note.text === "string") ? note.text : "",
          folder: (note && typeof note.folder === "string") ? note.folder : "",
          tags: (note && Array.isArray(note.tags)) ? note.tags : [],
          pinned: !!(note && note.pinned),
          createdAt: (note && note.createdAt) || 0,
          updatedAt: (note && note.updatedAt) || 0
        };
      }

      function sortNotes(list, sortKey) {
        var parts = sortKey.split("-");
        var field = parts[0];
        var dir = parts[1] || "desc";
        return list.slice().sort(function (a, b) {
          var va, vb;
          if (field === "updated") { va = a.updatedAt; vb = b.updatedAt; }
          else if (field === "title") { va = (a.title || "").toLocaleLowerCase(); vb = (b.title || "").toLocaleLowerCase(); }
          else if (field === "words") { va = getNoteWordCount(a); vb = getNoteWordCount(b); }
          else { va = a.updatedAt; vb = b.updatedAt; }
          var cmp = va < vb ? -1 : va > vb ? 1 : 0;
          return dir === "asc" ? cmp : -cmp;
        });
      }

      function buildFilteredNotes() {
        var query = ($("notesSearch")?.value || "").trim().toLocaleLowerCase();
        var folder = notesFilterFolder;
        var tag = notesFilterTag.toLocaleLowerCase();
        return notes.filter(function (note) {
          if (folder && (note.folder || "") !== folder) return false;
          if (tag && !note.tags.some(function (t) { return t.toLocaleLowerCase() === tag; })) return false;
          if (query && (note.title + " " + note.text).toLocaleLowerCase().indexOf(query) === -1) return false;
          return true;
        });
      }

      function renderActiveTagFilters() {
        var container = $("activeFilterTags");
        container.replaceChildren();
        var active = [];
        if (notesFilterTag) active.push(notesFilterTag);
        if (!active.length) { container.classList.add("hidden"); return; }
        container.classList.remove("hidden");
        active.forEach(function (tag) {
          var chip = document.createElement("span");
          chip.className = "inline-flex items-center gap-1 rounded border border-amber-500/30 bg-amber-500/10 px-2 py-0.5 text-[10px] font-bold text-amber-400";
          chip.innerHTML = tag + " <button class=\"ml-1 text-amber-500 hover:text-white\" data-remove-tag=\"" + escapeHTML(tag) + "\">&times;</button>";
          chip.querySelector("[data-remove-tag]").addEventListener("click", function () {
            notesFilterTag = ""; renderNotes();
          });
          container.appendChild(chip);
        });
      }

      function refreshFolderFilter() {
        try {
          var select = $("notesFolderFilter");
          var current = select.value;
          var used = new Set();
          notes.forEach(function (n) { if (n.folder) used.add(n.folder); });
          select.replaceChildren();
          var allOpt = document.createElement("option"); allOpt.value = ""; allOpt.textContent = "All folders"; select.appendChild(allOpt);
          Array.from(used).sort().forEach(function (f) {
            var opt = document.createElement("option"); opt.value = f; opt.textContent = f; select.appendChild(opt);
          });
          select.value = current === "" || used.has(current) ? current : "";
          notesFilterFolder = select.value;
        } catch (e) { /* keep UI alive */ }
      }

      function renderNotes() {
        try {
          var query = ($("notesSearch")?.value || "").trim().toLocaleLowerCase();
          var filtered = buildFilteredNotes();
          var pinned = filtered.filter(function (n) { return n.pinned; });
          var unpinned = filtered.filter(function (n) { return !n.pinned; });
          pinned = sortNotes(pinned, notesSortKey);
          unpinned = sortNotes(unpinned, notesSortKey);
          var sorted = pinned.concat(unpinned);

          ui.notesList.replaceChildren();
          $("noteCountBadge").textContent = notes.length;
          $("noteCountBadge").classList.toggle("hidden", notes.length === 0);
          renderActiveTagFilters();

          if (!filtered.length) {
            var empty = document.createElement("div");
            empty.className = "flex h-full min-h-56 flex-col items-center justify-center px-8 text-center text-stone-500";
            empty.innerHTML = '<svg class="mb-3 h-10 w-10 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" stroke-width="1.5"/></svg><p class="text-sm font-semibold text-stone-400">' + (query || notesFilterFolder || notesFilterTag ? "No notes match your filters" : "No saved notes") + '</p><p class="mt-1 text-xs leading-relaxed">' + (query || notesFilterFolder || notesFilterTag ? "Try a different search or clear filters." : "Your saved transcripts will appear here.") + '</p>';
            ui.notesList.appendChild(empty);
            return;
          }

          var fragment = document.createDocumentFragment();
          sorted.forEach(function (rawNote) {
            try {
              var note = safeNote(rawNote);
              var item = document.createElement("article");
              item.className = "group mb-2.5 rounded-2xl border border-white/5 bg-white/[0.02] p-4 transition hover:border-white/10 hover:bg-white/5 " + (note.pinned ? "border-l-2 border-l-amber-500 bg-amber-500/5" : "");

              var topRow = document.createElement("div");
              topRow.className = "flex items-start gap-3";

              var checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.className = (notesSelectMode ? "" : "hidden ") + "mt-1 h-4 w-4 shrink-0 accent-amber-500 cursor-pointer rounded";
              checkbox.checked = notesSelectedIds.has(note.id);
              checkbox.addEventListener("change", function () {
                if (checkbox.checked) notesSelectedIds.add(note.id); else notesSelectedIds.delete(note.id);
                updateBulkBar();
              });

              var pinBtn = document.createElement("button");
              pinBtn.className = "shrink-0 mt-0.5 rounded p-0.5 transition " + (note.pinned ? "text-amber-400" : "text-stone-600 hover:text-amber-400");
              pinBtn.title = note.pinned ? "Unpin" : "Pin to top";
              pinBtn.innerHTML = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="' + (note.pinned ? "currentColor" : "none") + '" stroke="currentColor"><path d="m15.5 3 2.2 2.2-10.2 10.2L2 16l4.3-3c.6-.4 1-1 1-1.7v-4.8c0-.6.3-1.2.7-1.6L10 2.7c.4-.4 1-.7 1.6-.7h4.8c.6 0 1.2.3 1.7 1Z" stroke-width="2" stroke-linejoin="round"/></svg>';
              pinBtn.addEventListener("click", function (e) { e.stopPropagation(); togglePin(note.id); });

              var textBlock = document.createElement("button");
              textBlock.className = "min-w-0 flex-1 text-left";
              textBlock.addEventListener("click", function () { loadNote(note.id); });

              var heading = document.createElement("strong");
              heading.className = "block truncate text-sm font-semibold text-stone-200";
              heading.innerHTML = highlightMatches(note.title, query);

              var preview = document.createElement("p");
              preview.className = "mt-1 line-clamp-2 text-xs leading-relaxed text-stone-400";
              var previewText = (note.text || "").replace(/\n/g, " ");
              preview.innerHTML = highlightMatches(previewText, query);

              textBlock.append(heading, preview);
              topRow.append(checkbox, pinBtn, textBlock);
              item.appendChild(topRow);

              var metaRow = document.createElement("div");
              metaRow.className = "mt-3.5 flex flex-wrap items-center gap-2";

              var folderChip = document.createElement("span");
              folderChip.className = "inline-flex cursor-pointer items-center gap-1 rounded border px-2 py-0.5 text-[10px] font-bold transition " + (note.folder ? "border-amber-500/30 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20" : "border-white/10 text-stone-500 hover:bg-white/10");
              folderChip.textContent = note.folder || "No folder";
              folderChip.title = "Filter by this folder";
              folderChip.addEventListener("click", function (e) {
                e.stopPropagation();
                if (note.folder) { notesFilterFolder = note.folder; $("notesFolderFilter").value = note.folder; }
                else { notesFilterFolder = ""; $("notesFolderFilter").value = ""; }
                renderNotes();
              });
              metaRow.appendChild(folderChip);

              note.tags.forEach(function (tag) {
                var tagChip = document.createElement("span");
                tagChip.className = "inline-flex cursor-pointer items-center rounded border border-stone-600/40 bg-stone-800/50 px-2 py-0.5 text-[10px] font-bold text-stone-300 transition hover:bg-stone-700/50";
                tagChip.textContent = tag;
                tagChip.title = "Filter by tag: " + tag;
                tagChip.addEventListener("click", function (e) {
                  e.stopPropagation();
                  notesFilterTag = tag; renderNotes();
                });
                metaRow.appendChild(tagChip);
              });

              var addTagBtn = document.createElement("button");
              addTagBtn.className = "rounded px-1.5 py-0.5 text-[10px] font-bold text-stone-500 transition hover:bg-white/10 hover:text-stone-300";
              addTagBtn.textContent = "+ tag";
              addTagBtn.title = "Add tag";
              addTagBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                var newTag = (prompt("Enter tag for \"" + note.title + "\":") || "").trim();
                if (!newTag) return;
                if (!note.tags.includes(newTag)) { note.tags.push(newTag); persistNotes(); }
              });
              metaRow.appendChild(addTagBtn);

              item.appendChild(metaRow);

              var footer = document.createElement("div");
              footer.className = "mt-4 flex items-center justify-between pt-3 border-t border-white/5";

              var date = document.createElement("span");
              date.className = "mono text-[9px] font-bold tracking-wider text-stone-600 uppercase";
              date.textContent = new Date(note.updatedAt).toLocaleDateString() + ' ' + new Date(note.updatedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

              var actions = document.createElement("div");
              actions.className = "flex gap-1";

              var folderBtn = document.createElement("button");
              folderBtn.className = "rounded px-2.5 py-1 text-[10px] font-bold text-stone-400 transition hover:bg-white/10 hover:text-white";
              folderBtn.textContent = "Folder";
              folderBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                var newFolder = (prompt("Set folder for \"" + note.title + "\":\n\nExisting folders: " + (folders.join(", ") || "none") + "\n\nType a name (or blank for none):", note.folder || "") || "").trim();
                note.folder = newFolder;
                if (newFolder && folders.indexOf(newFolder) === -1) folders.push(newFolder);
                persistNotes();
              });
              actions.appendChild(folderBtn);

              var removeBtn = document.createElement("button");
              removeBtn.className = "rounded px-2.5 py-1 text-[10px] font-bold text-stone-400 transition hover:bg-red-500/20 hover:text-red-400";
              removeBtn.textContent = "Delete";
              removeBtn.addEventListener("click", function () { deleteNote(note.id); });
              actions.appendChild(removeBtn);

              footer.append(date, actions);
              item.appendChild(footer);
              fragment.appendChild(item);
            } catch (e) { /* skip bad note */ }
          });
          ui.notesList.appendChild(fragment);
          updateBulkBar();
        } catch (e) { /* prevent render crash from breaking all buttons */ }
      }

      function loadNote(id) {
        const note = notes.find((item) => item.id === id);
        if (!note) return;
        stopListening(false);
        activeNoteId = note.id;
        ui.title.value = note.title;
        ui.transcript.value = note.text;
        onTranscriptChanged();
        closeOverlays();
        showToast("Saved note opened.", "success");
      }

      function deleteNote(id) {
        var note = notes.find(function (item) { return item.id === id; });
        if (!note || !confirm("Delete \"" + note.title + "\"?")) return;
        notes = notes.filter(function (item) { return item.id !== id; });
        if (activeNoteId === id) activeNoteId = null;
        notesSelectedIds.delete(id);
        persistNotes();
        saveDraft();
        showToast("Note deleted.");
      }

      function togglePin(id) {
        var note = notes.find(function (item) { return item.id === id; });
        if (!note) return;
        note.pinned = !note.pinned;
        persistNotes();
        showToast(note.pinned ? "Note pinned to top." : "Note unpinned.");
      }

      function updateBulkBar() {
        var bar = $("notesBulkBar");
        if (!notesSelectMode) { bar.classList.add("hidden"); return; }
        bar.classList.remove("hidden");
        $("notesBulkCount").textContent = notesSelectedIds.size + " selected";
      }

      function toggleSelectMode() {
        notesSelectMode = !notesSelectMode;
        if (!notesSelectMode) notesSelectedIds.clear();
        renderNotes();
      }

      function bulkDeleteNotes() {
        if (!notesSelectedIds.size) return;
        if (!confirm("Delete " + notesSelectedIds.size + " selected note(s)?")) return;
        notes = notes.filter(function (n) { return !notesSelectedIds.has(n.id); });
        notesSelectedIds.forEach(function (id) { if (activeNoteId === id) activeNoteId = null; });
        notesSelectedIds.clear();
        notesSelectMode = false;
        persistNotes();
        saveDraft();
        showToast("Bulk delete complete.", "success");
      }

      function bulkExportNotes() {
        if (!notesSelectedIds.size) return;
        var selectedNotes = notes.filter(function (n) { return notesSelectedIds.has(n.id); });
        var combined = "";
        selectedNotes.forEach(function (n) {
          combined += "=== " + n.title + " ===\n" + (n.folder ? "Folder: " + n.folder + "\n" : "") + (n.tags.length ? "Tags: " + n.tags.join(", ") + "\n" : "") + "Date: " + new Date(n.updatedAt).toLocaleString() + "\n\n" + n.text + "\n\n\n";
        });
        var filename = "vocalScribe-export-" + new Date().toISOString().slice(0, 10) + ".txt";
        var url = URL.createObjectURL(new Blob([combined], { type: "text/plain;charset=utf-8" }));
        var anchor = document.createElement("a"); anchor.href = url; anchor.download = filename;
        document.body.appendChild(anchor); anchor.click(); anchor.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 500);
        showToast("Exported " + selectedNotes.length + " note(s).", "success");
      }

      function selectAllNotes() {
        var filtered = buildFilteredNotes();
        if (notesSelectedIds.size === filtered.length) { notesSelectedIds.clear(); }
        else { filtered.forEach(function (n) { notesSelectedIds.add(n.id); }); }
        renderNotes();
      }

      function newNote() {
        if (ui.transcript.value.trim() && !confirm("Start a new transcript? Save the current transcript first if you want to keep it.")) return;
        stopListening(false);
        activeNoteId = null;
        ui.title.value = "Untitled transcript";
        ui.transcript.value = "";
        onTranscriptChanged();
        closeOverlays();
        ui.transcript.focus();
      }

      function openOverlay(element) {
        closeOverlays(false);
        ui.backdrop.classList.remove("hidden");
        // Force reflow for fade in
        void ui.backdrop.offsetWidth;
        ui.backdrop.classList.remove("opacity-0");
        
        if (element === ui.notesDrawer) {
          element.classList.remove("translate-x-full");
          element.setAttribute("aria-hidden", "false");
          setTimeout(() => $("notesSearch").focus(), 300);
        } else {
          element.classList.remove("hidden");
        }
      }

      function closeOverlays(hideBackdrop = true) {
        ui.notesDrawer.classList.add("translate-x-full");
        ui.notesDrawer.setAttribute("aria-hidden", "true");
        ui.settingsModal.classList.add("hidden");
        ui.actionsModal.classList.add("hidden");
        $("findBar").classList.add("hidden");
        $("findBar").classList.remove("grid");
        
        if (hideBackdrop) {
          ui.backdrop.classList.add("opacity-0");
          setTimeout(() => ui.backdrop.classList.add("hidden"), 300);
        }
      }

      async function copyText() {
        if (!ui.transcript.value.trim()) return showToast("There is no transcript to copy.", "error");
        try {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard API unavailable");
          await navigator.clipboard.writeText(ui.transcript.value);
          showToast("Transcript copied.", "success");
        } catch {
          ui.transcript.select();
          document.execCommand("copy");
          showToast("Transcript copied.", "success");
        }
      }

      function toggleReadAloud() {
        if (!("speechSynthesis" in window)) return showToast("Read aloud is not supported here.", "error");
        if (isReading) {
          speechSynthesis.cancel();
          isReading = false;
          showToast("Reading stopped.");
          return;
        }
        if (!ui.transcript.value.trim()) return showToast("There is no text to read.", "error");
        if (wantsToListen || recognitionRunning || startPending) stopListening(false);
        const utterance = new SpeechSynthesisUtterance(ui.transcript.value);
        utterance.lang = $("languageSelect").value;
        utterance.rate = settings.speechRate;
        utterance.onstart = () => { isReading = true; };
        utterance.onend = utterance.onerror = () => { isReading = false; };
        speechSynthesis.speak(utterance);
        showToast("Reading transcript aloud.");
      }

      function cleanFillers() {
        const original = ui.transcript.value;
        if (!original.trim()) return showToast("There is no transcript to clean.", "error");
        const cleaned = original
          .replace(/\b(um+|uh+|erm+|ah+|like)\b[,.!?]?\s*/gi, "")
          .replace(/\b(you know|sort of|kind of|I mean|basically|literally|actually|you see|I guess)\b[,.!?]?\s*/gi, "")
          .replace(/ {2,}/g, " ")
          .replace(/\n +/g, "\n")
          .replace(/\n{3,}/g, "\n\n")
          .replace(/(^|[.!?]\s+)([a-z])/g, (_, start, letter) => start + letter.toUpperCase());
        if (cleaned === original) return showToast("No common filler words were found.");
        ui.transcript.value = cleaned;
        onTranscriptChanged();
        showToast("Common filler words removed.", "success");
      }

      function replaceAll() {
        const search = $("findInput").value;
        if (!search) return;
        const replacement = $("replaceInput").value;
        const escaped = search.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const regex = new RegExp(escaped, "gi");
        const matches = ui.transcript.value.match(regex);
        if (!matches) return showToast("No matches found.");
        ui.transcript.value = ui.transcript.value.replace(regex, replacement);
        onTranscriptChanged();
        showToast(`${matches.length} match${matches.length === 1 ? "" : "es"} replaced.`, "success");
      }

      function safeFilename() {
        return (ui.title.value.trim() || "transcript").replace(/[^a-z0-9-_]+/gi, "-").replace(/^-|-$/g, "").slice(0, 60) || "transcript";
      }

      function download(content, extension, type) {
        if (!ui.transcript.value.trim()) return showToast("There is no transcript to export.", "error");
        const url = URL.createObjectURL(new Blob([content], { type }));
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = `${safeFilename()}.${extension}`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }

      function exportDocument(format) {
        const title = ui.title.value.trim() || "Untitled transcript";
        const text = ui.transcript.value;
        if (format === "txt") download(text, "txt", "text/plain;charset=utf-8");
        if (format === "md") download(`# ${title}\n\n${text}\n`, "md", "text/markdown;charset=utf-8");
        if (format === "doc") {
          const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
          const safeTitle = title.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${safeTitle}</title></head><body><h1>${safeTitle}</h1><p>${escaped}</p></body></html>`;
          download(html, "doc", "application/msword");
        }
        closeOverlays();
      }

      function printTranscript() {
        if (!ui.transcript.value.trim()) return showToast("There is no transcript to print.", "error");
        $("printTitle").textContent = ui.title.value.trim() || "Untitled transcript";
        $("printDate").textContent = `Prepared ${new Date().toLocaleString()}`;
        $("printBody").textContent = ui.transcript.value;
        closeOverlays();
        window.print();
      }

      async function shareTranscript() {
        if (!ui.transcript.value.trim()) return showToast("There is no transcript to share.", "error");
        try {
          if (navigator.share) await navigator.share({ title: ui.title.value, text: ui.transcript.value });
          else if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(ui.transcript.value);
            showToast("Sharing is unavailable, so the transcript was copied.", "success");
          } else {
            await copyText();
          }
        } catch (error) {
          if (error?.name !== "AbortError") showToast("Could not share the transcript.", "error");
        }
        closeOverlays();
      }

      function applySettingsToUI() {
        $("continuousSetting").checked = settings.continuous;
        $("commandsSetting").checked = settings.commands;
        $("soundSetting").checked = settings.sound;
        $("hapticSetting").checked = settings.haptic;
        $("speechRateSetting").value = settings.speechRate;
        $("speechRateLabel").textContent = `${Number(settings.speechRate).toFixed(1)}x`;
      }

      function saveSettingsFromUI() {
        const continuousChanged = settings.continuous !== $("continuousSetting").checked;
        settings = {
          continuous: $("continuousSetting").checked,
          commands: $("commandsSetting").checked,
          sound: $("soundSetting").checked,
          haptic: $("hapticSetting").checked,
          speechRate: Number($("speechRateSetting").value)
        };
        try {
          localStorage.setItem("vocalScribeSettings", JSON.stringify(settings));
        } catch {}
        if (continuousChanged && recognition) recognition.continuous = settings.continuous;
      }

      let recordClickLock = false;
      ui.record.addEventListener("click", () => {
        if (recordClickLock) return;
        recordClickLock = true;
        setTimeout(() => { recordClickLock = false; }, 350);
        if (wantsToListen || recognitionRunning || startPending) {
          stopListening();
        } else {
          startListening();
        }
      });
      
      ui.transcript.addEventListener("input", onTranscriptChanged);
      ui.title.addEventListener("input", onTranscriptChanged);
      $("languageSelect").addEventListener("change", restartRecognitionForLanguage);
      $("saveButton").addEventListener("click", saveNote);
      $("copyButton").addEventListener("click", copyText);
      $("readButton").addEventListener("click", toggleReadAloud);
      $("notesButton").addEventListener("click", () => openOverlay(ui.notesDrawer));
      $("settingsButton").addEventListener("click", () => openOverlay(ui.settingsModal));
      $("moreButton").addEventListener("click", () => openOverlay(ui.actionsModal));
      $("newNoteButton").addEventListener("click", newNote);
      $("notesSearch").addEventListener("input", renderNotes);
      $("notesSort").addEventListener("change", function () { notesSortKey = this.value; renderNotes(); });
      $("notesFolderFilter").addEventListener("change", function () { notesFilterFolder = this.value; renderNotes(); });
      $("notesSelectToggle").addEventListener("click", toggleSelectMode);
      $("notesBulkSelectAll").addEventListener("click", selectAllNotes);
      $("notesBulkExport").addEventListener("click", bulkExportNotes);
      $("notesBulkDelete").addEventListener("click", bulkDeleteNotes);
      
      ui.backdrop.addEventListener("click", () => {
        saveSettingsFromUI();
        closeOverlays();
      });
      document.querySelectorAll("[data-close-overlay]").forEach((button) => button.addEventListener("click", () => {
        saveSettingsFromUI();
        closeOverlays();
      }));

      $("findButton").addEventListener("click", () => {
        $("findBar").classList.remove("hidden");
        $("findBar").classList.add("grid");
        $("findInput").focus();
      });
      $("closeFindButton").addEventListener("click", () => {
        $("findBar").classList.add("hidden");
        $("findBar").classList.remove("grid");
      });
      $("replaceButton").addEventListener("click", replaceAll);
      $("cleanButton").addEventListener("click", cleanFillers);
      
      $("fontDownButton").addEventListener("click", () => {
        fontSize = Math.max(13, fontSize - 2);
        ui.transcript.style.fontSize = `${fontSize}px`;
      });
      $("fontUpButton").addEventListener("click", () => {
        fontSize = Math.min(34, fontSize + 2);
        ui.transcript.style.fontSize = `${fontSize}px`;
      });
      $("undoButton").addEventListener("click", () => { ui.transcript.focus(); document.execCommand("undo"); onTranscriptChanged(); });
      $("redoButton").addEventListener("click", () => { ui.transcript.focus(); document.execCommand("redo"); onTranscriptChanged(); });
      $("speechRateSetting").addEventListener("input", (event) => {
        $("speechRateLabel").textContent = `${Number(event.target.value).toFixed(1)}x`;
      });

      document.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", () => {
        const action = button.dataset.action;
        if (action === "copy") { copyText(); closeOverlays(); }
        else if (action === "read") { toggleReadAloud(); closeOverlays(); }
        else if (["txt", "md", "doc"].includes(action)) exportDocument(action);
        else if (action === "print") printTranscript();
        else if (action === "share") shareTranscript();
        else if (action === "clear") {
          if (ui.transcript.value && confirm("Clear the entire transcript?")) {
            ui.transcript.value = "";
            activeNoteId = null;
            onTranscriptChanged();
            closeOverlays();
          }
        }
      }));

      document.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          ui.record.click();
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          saveNote();
        }
        if (event.key === "Escape") {
          saveSettingsFromUI();
          closeOverlays();
        }
      });

      window.addEventListener("beforeunload", () => {
        saveDraft();
        stopLevelMeter();
      });
    });
  </script>
</body>
</html>
