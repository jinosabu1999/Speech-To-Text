<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0c0a09] text-stone-200 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
  <meta name="theme-color" content="#0c0a09">
  <title>VocalScribe - Minimalist Speech to Text</title>
  
  <!-- Tailwind V4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand: #f59e0b; /* Amber 500 */
      --brand-glow: rgba(245, 158, 11, 0.4);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.4);
    }
    
    body {
      font-family: "Inter", system-ui, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    .mono { font-family: "JetBrains Mono", monospace; }
    
    /* Elegant Scrollbars */
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    /* Animations */
    @keyframes mic-pulse { 
      0% { transform: scale(1); opacity: 0.6; } 
      100% { transform: scale(2.2); opacity: 0; } 
    }
    @keyframes mic-glow { 
      0%, 100% { box-shadow: 0 0 15px 2px var(--brand-glow); } 
      50% { box-shadow: 0 0 35px 8px var(--brand-glow); } 
    }
    @keyframes rec-glow { 
      0%, 100% { box-shadow: 0 0 20px 4px var(--danger-glow); } 
      50% { box-shadow: 0 0 45px 12px var(--danger-glow); } 
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-16px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes slide-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scale-in { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .mic-ring { animation: mic-pulse 2s cubic-bezier(0.2, 0, 0.2, 1) infinite; }
    .mic-glow { animation: mic-glow 2.5s ease-in-out infinite; }
    .rec-glow { animation: rec-glow 2s ease-in-out infinite; }
    .meter-bar { transform-origin: bottom; transition: height 80ms ease-out; }
    
    .toast-in { animation: toast-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .slide-up { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .scale-in { animation: scale-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Editor Specifics */
    #transcript { caret-color: var(--brand); line-height: 1.75; }
    
    /* Layout utilities */
    .pb-safe { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    .pt-safe-top { padding-top: max(1rem, env(safe-area-inset-top)); }

    /* Print Styles */
    @media print {
      body { background: white !important; color: black !important; overflow: visible !important; }
      #app, #toastRegion, .modal-layer, #controlDock, #savedNotesSection { display: none !important; }
      #printDocument { display: block !important; padding: 0.5in; font-family: serif; }
      #printDocument h1 { font-size: 24pt; margin-bottom: 8pt; border-bottom: 1px solid #ddd; padding-bottom: 8px;}
      #printDocument .print-date { color: #666; font-size: 11pt; margin-bottom: 24pt; font-family: sans-serif; }
      #printDocument .print-body { white-space: pre-wrap; font-size: 12pt; line-height: 1.6; }
    }
  </style>
</head>
<body class="h-full custom-scroll overflow-y-auto overflow-x-hidden">

  <!-- Toasts -->
  <div id="toastRegion" class="pointer-events-none fixed left-4 right-4 top-4 z-[100] flex flex-col items-center gap-3 sm:left-auto sm:right-6 sm:w-80" aria-live="polite"></div>

  <!-- Global Header -->
  <header class="pt-safe-top flex h-[80px] shrink-0 items-center justify-between px-4 sm:px-8 max-w-7xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 shadow-lg shadow-amber-900/20">
        <svg class="h-5 w-5 text-stone-950" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Z" stroke-width="2.5" stroke-linecap="round"/><path d="M19 10.5v.5a7 7 0 0 1-14 0v-.5M12 18v3M9 21h6" stroke-width="2.5" stroke-linecap="round"/></svg>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-stone-100">VocalScribe</h1>
    </div>
    
    <div id="headerStatus" class="flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-bold uppercase tracking-widest text-stone-300">
      <span id="statusDot" class="h-2 w-2 rounded-full bg-emerald-500 transition-colors duration-300 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span>
      <span id="statusLabel" class="hidden sm:inline">Ready</span>
    </div>
  </header>

  <!-- Main App Content -->
  <main id="app" class="max-w-7xl mx-auto w-full px-4 sm:px-8 pb-40 flex flex-col gap-12 pt-4">
    
    <!-- 1. ACTIVE DICTATION EDITOR -->
    <section id="activeEditor" class="relative flex flex-col rounded-[32px] border border-white/5 bg-[#141210] shadow-2xl transition-colors focus-within:border-amber-500/30">
      
      <!-- Editor Header (Title & Tags) -->
      <div class="flex flex-col gap-3 border-b border-white/5 p-6 sm:p-8 pb-4">
        <div class="flex justify-between items-start gap-4">
          <input id="noteTitle" class="w-full bg-transparent text-2xl sm:text-3xl font-bold text-stone-100 placeholder:text-stone-700 outline-none truncate transition-colors focus:text-white" maxlength="80" value="Untitled transcript" aria-label="Transcript title" dir="auto">
          <div class="flex flex-col items-end gap-1 mt-1 shrink-0">
            <span id="saveState" class="mono text-[10px] font-bold text-stone-500 tracking-widest">DRAFT</span>
            <span id="saveIndicator" class="hidden h-1.5 w-1.5 rounded-full bg-amber-500"></span>
          </div>
        </div>
        
        <!-- Pre-Save Tagging Area -->
        <div class="flex flex-wrap items-center gap-2">
          <div id="activeTagsContainer" class="flex flex-wrap gap-2"></div>
          <input type="text" id="tagInput" class="bg-transparent border border-stone-800 rounded-lg px-3 py-1.5 text-xs font-semibold text-stone-300 outline-none focus:border-amber-500/50 focus:bg-stone-900 w-28 placeholder:text-stone-600 transition-all" placeholder="+ Add tag" maxlength="20">
        </div>
      </div>

      <!-- Find & Replace Bar (Hidden by default) -->
      <div id="findBar" class="hidden shrink-0 grid-cols-[1fr_auto_auto] items-center gap-2 border-b border-amber-500/20 bg-amber-500/5 px-6 sm:px-8 py-3 sm:grid-cols-[1fr_1fr_auto_auto]">
        <input id="findInput" class="col-span-3 min-w-0 rounded-lg border border-white/10 bg-black/40 px-3 py-2 text-sm text-white outline-none focus:border-amber-500 sm:col-span-1" placeholder="Find text">
        <input id="replaceInput" class="min-w-0 rounded-lg border border-white/10 bg-black/40 px-3 py-2 text-sm text-white outline-none focus:border-amber-500" placeholder="Replace with">
        <button id="replaceButton" class="h-9 shrink-0 rounded-lg bg-amber-600 px-4 text-xs font-bold text-stone-950 transition hover:bg-amber-500 shadow-sm">Replace all</button>
        <button id="closeFindButton" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/5 text-stone-400 transition hover:bg-white/10 hover:text-white">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 6 12 12M18 6 6 18" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- Textarea -->
      <div class="relative min-h-[300px]">
        <textarea id="transcript" class="custom-scroll absolute inset-0 h-full w-full resize-none bg-transparent px-6 py-6 sm:px-8 sm:py-6 text-[17px] text-stone-300 outline-none placeholder:text-stone-700" spellcheck="true" placeholder="Tap the microphone to start speaking.&#10;&#10;Your transcript will appear here in real time. You can edit text and add tags before saving." aria-label="Transcript editor" dir="auto"></textarea>
      </div>

      <!-- Editor Footer (Stats & Toolbar) -->
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-t border-white/5 bg-[#0f0d0b] p-4 sm:px-8 rounded-b-[32px]">
        <!-- Document Stats -->
        <div class="flex gap-4 text-[10px] sm:text-xs text-stone-500 font-bold uppercase tracking-widest shrink-0">
          <span><span id="wordCount" class="text-stone-300">0</span> words</span>
          <span><span id="charCount" class="text-stone-300">0</span> chars</span>
          <span class="hidden sm:inline"><span id="sentenceCount" class="text-stone-300">0</span> sents</span>
        </div>
        
        <!-- Formatting Tools -->
        <div class="no-scrollbar flex shrink-0 items-center gap-1.5 overflow-x-auto">
          <div class="flex h-9 items-center gap-1 rounded-xl bg-white/5 px-2.5 shadow-inner border border-white/5">
            <select id="languageSelect" class="bg-transparent text-[11px] font-bold text-stone-300 outline-none cursor-pointer uppercase tracking-wider" aria-label="Recognition language">
              <option value="en-US">EN (US)</option>
              <option value="en-GB">EN (UK)</option>
              <option value="en-IN">EN (IN)</option>
              <option value="en-AU">EN (AU)</option>
              <option value="es-ES">ES</option>
              <option value="fr-FR">FR</option>
              <option value="de-DE">DE</option>
              <option value="it-IT">IT</option>
              <option value="pt-BR">PT</option>
              <option value="hi-IN">HI</option>
              <option value="ar-SA">AR</option>
              <option value="zh-CN">ZH</option>
              <option value="ja-JP">JA</option>
              <option value="ko-KR">KO</option>
              <option value="ru-RU">RU</option>
            </select>
          </div>
          
          <div class="h-4 w-px bg-white/10 mx-1 shrink-0"></div>
          
          <button id="undoButton" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-white/5 text-stone-400 transition hover:bg-white/10 hover:text-stone-100" title="Undo">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          
          <div class="h-4 w-px bg-white/10 mx-1 shrink-0"></div>
          
          <button id="findButton" class="flex h-9 shrink-0 items-center gap-1.5 rounded-xl bg-white/5 px-3 text-[11px] font-bold uppercase tracking-wider text-stone-300 transition hover:bg-white/10 hover:text-stone-100">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="6" stroke-width="2"/><path d="m16 16 4 4" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="hidden sm:inline">Find</span>
          </button>
          
          <button id="cleanButton" class="flex h-9 shrink-0 items-center gap-1.5 rounded-xl bg-amber-500/10 border border-amber-500/20 px-3 text-[11px] font-bold uppercase tracking-wider text-amber-500 transition hover:bg-amber-500/20 hover:text-amber-400" title="Remove common filler words">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3ZM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z" stroke-width="2" stroke-linejoin="round"/></svg>
            <span class="hidden sm:inline">Clean</span>
          </button>
        </div>
      </div>
      
      <!-- Live Transcription Bubble (Absolute to the editor) -->
      <div id="interimBubble" class="pointer-events-none absolute bottom-24 left-1/2 -translate-x-1/2 w-[90%] max-w-lg hidden z-10 slide-up" aria-live="polite">
        <div class="flex items-center gap-3 rounded-2xl bg-[#1c1917]/95 px-5 py-3.5 text-sm shadow-2xl backdrop-blur-xl border border-white/10 ring-1 ring-amber-500/20">
          <span class="h-2 w-2 shrink-0 animate-pulse rounded-full bg-amber-500"></span>
          <span id="interimText" class="truncate italic text-stone-200"></span>
        </div>
      </div>
    </section>

    <!-- 2. SAVED TRANSCRIPTS DASHBOARD -->
    <section id="savedNotesSection" class="flex flex-col gap-6">
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
        <div>
          <h2 class="text-2xl font-bold text-white tracking-tight">Your Transcripts</h2>
          <p class="text-xs text-stone-500 mt-1">Saved locally on this device</p>
        </div>
        
        <!-- Search & Filter Controls -->
        <div class="flex gap-2 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-64">
            <svg class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-500" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="notesSearch" class="w-full rounded-xl border border-white/5 bg-[#141210] pl-9 pr-4 py-2.5 text-sm text-stone-100 placeholder:text-stone-600 outline-none focus:border-amber-500/50 focus:bg-stone-900 transition-all shadow-inner" placeholder="Search saved notes...">
          </div>
          <!-- Sort Dropdown hidden visually but kept via logic linked to a simplified UI if needed. We'll keep it simple for the dashboard. -->
        </div>
      </div>

      <!-- Active Dashboard Tags Filter -->
      <div id="activeFilterTags" class="hidden flex-wrap items-center gap-2"></div>

      <!-- The Grid of Saved Notes -->
      <div id="savedNotesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Cards injected via JS -->
      </div>
    </section>
  </main>

  <!-- 3. FLOATING DYNAMIC DOCK (Re-engineered) -->
  <div class="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none z-40 pb-safe px-4">
    <nav id="controlDock" class="pointer-events-auto flex items-center gap-1 sm:gap-2 px-2 sm:px-3 py-2 bg-[#1c1917]/85 backdrop-blur-3xl border border-white/10 rounded-full shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
      
      <!-- Dock Left -->
      <button id="newNoteButton" class="group flex flex-col items-center justify-center h-12 w-12 sm:h-14 sm:w-14 rounded-full text-stone-400 transition hover:bg-white/10 hover:text-stone-100" aria-label="New Note">
        <svg class="h-5 w-5 sm:h-6 sm:w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      
      <button id="settingsButton" class="group flex flex-col items-center justify-center h-12 w-12 sm:h-14 sm:w-14 rounded-full text-stone-400 transition hover:bg-white/10 hover:text-stone-100" aria-label="Settings">
        <svg class="h-5 w-5 sm:h-6 sm:w-6 transition-transform group-hover:rotate-45" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke-width="1.8"/></svg>
      </button>

      <!-- Dock Center: Giant Mic Button -->
      <div class="relative mx-1 sm:mx-3 flex flex-col items-center justify-center">
        <!-- Level Meter Waveform floating above mic -->
        <div id="levelMeter" class="absolute -top-8 flex h-6 w-full items-end justify-center gap-1 opacity-0 transition-opacity duration-300 pointer-events-none" aria-hidden="true">
          <span class="meter-bar w-[3px] rounded-full bg-orange-500" style="height:4px;"></span>
          <span class="meter-bar w-[3px] rounded-full bg-amber-400" style="height:8px;"></span>
          <span class="meter-bar w-[3px] rounded-full bg-yellow-400" style="height:12px;"></span>
          <span class="meter-bar w-[3px] rounded-full bg-amber-400" style="height:8px;"></span>
          <span class="meter-bar w-[3px] rounded-full bg-orange-500" style="height:4px;"></span>
        </div>
        
        <div id="micPulse" class="mic-ring absolute inset-0 hidden h-full w-full rounded-full bg-amber-500/40 pointer-events-none"></div>
        
        <button id="recordButton" class="relative z-10 flex h-14 w-14 sm:h-[68px] sm:w-[68px] items-center justify-center rounded-full text-stone-950 bg-gradient-to-br from-amber-400 to-orange-600 shadow-[0_4px_20px_rgba(234,88,12,0.4)] border-[3px] border-[#1c1917] transition-all duration-300 hover:scale-[1.05] active:scale-[0.93] disabled:opacity-50" aria-label="Start listening" aria-pressed="false">
          <svg id="micIcon" class="h-6 w-6 sm:h-8 sm:w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Z" stroke-width="2" stroke-linecap="round"/><path d="M19 10.5v.5a7 7 0 0 1-14 0v-.5M12 18v3M9 21h6" stroke-width="2" stroke-linecap="round"/></svg>
          <svg id="stopIcon" class="hidden h-6 w-6 sm:h-8 sm:w-8 text-white" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
        </button>
        
        <span id="recordHint" class="absolute top-[110%] whitespace-nowrap text-[9px] font-bold tracking-wider text-stone-500 uppercase">Tap to speak</span>
      </div>

      <!-- Dock Right -->
      <button id="saveButton" class="group flex flex-col items-center justify-center h-12 w-12 sm:h-14 sm:w-14 rounded-full text-stone-400 transition hover:bg-white/10 hover:text-stone-100" aria-label="Save note">
        <svg class="h-5 w-5 sm:h-6 sm:w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 21 17 13 7 13 7 21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7 3 7 8 15 8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      
      <!-- Modern Tools Grid Icon -->
      <button id="moreButton" class="flex flex-col items-center justify-center h-12 w-12 sm:h-14 sm:w-14 rounded-full text-stone-400 transition hover:bg-white/10 hover:text-stone-100" aria-label="Document Tools">
        <svg class="h-5 w-5 sm:h-6 sm:w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke-width="2"/></svg>
      </button>
      
    </nav>
  </div>

  <!-- OVERLAYS & MODALS -->
  <div id="backdrop" class="modal-layer fixed inset-0 hidden fade-in bg-black/70 backdrop-blur-sm transition-opacity z-50"></div>

  <!-- Settings Modal -->
  <section id="settingsModal" class="modal-layer fixed bottom-0 inset-x-0 md:inset-auto md:left-1/2 md:top-1/2 md:-translate-x-1/2 md:-translate-y-1/2 z-[75] hidden max-h-[90dvh] w-full md:w-[420px] flex-col rounded-t-[32px] md:rounded-3xl border border-white/10 bg-[#1c1917] shadow-2xl scale-in pb-safe md:pb-0" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="flex items-center justify-between border-b border-white/5 px-6 py-5">
      <div>
        <h2 id="settingsTitle" class="text-base font-bold text-stone-100">Recognition Settings</h2>
        <p class="text-[11px] text-stone-400 mt-0.5">Applies to the next listening cycle</p>
      </div>
      <button data-close-overlay class="flex h-9 w-9 items-center justify-center rounded-full bg-white/5 text-stone-400 transition hover:bg-white/10 hover:text-white">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 6 12 12M18 6 6 18" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    
    <div class="custom-scroll overflow-y-auto px-6 py-2 divide-y divide-white/5">
      <label class="flex cursor-pointer items-center justify-between gap-4 py-4.5">
        <span><strong class="block text-sm text-stone-200">Continuous Listening</strong><span class="mt-1 block text-xs text-stone-500 leading-relaxed">Auto-restart after browser timeout.</span></span>
        <input id="continuousSetting" type="checkbox" checked class="h-5 w-5 accent-amber-500 cursor-pointer rounded">
      </label>
      <label class="flex cursor-pointer items-center justify-between gap-4 py-4.5">
        <span><strong class="block text-sm text-stone-200">Spoken Commands</strong><span class="mt-1 block text-xs text-stone-500 leading-relaxed">Say "period", "new line", "stop".</span></span>
        <input id="commandsSetting" type="checkbox" checked class="h-5 w-5 accent-amber-500 cursor-pointer rounded">
      </label>
      <label class="flex cursor-pointer items-center justify-between gap-4 py-4.5">
        <span><strong class="block text-sm text-stone-200">Sound Feedback</strong><span class="mt-1 block text-xs text-stone-500 leading-relaxed">Soft tone when mic state changes.</span></span>
        <input id="soundSetting" type="checkbox" checked class="h-5 w-5 accent-amber-500 cursor-pointer rounded">
      </label>
      <label class="flex cursor-pointer items-center justify-between gap-4 py-4.5 pb-6">
        <span><strong class="block text-sm text-stone-200">Haptic Feedback</strong><span class="mt-1 block text-xs text-stone-500 leading-relaxed">Short vibrations on supported phones.</span></span>
        <input id="hapticSetting" type="checkbox" checked class="h-5 w-5 accent-amber-500 cursor-pointer rounded">
      </label>
    </div>
    
    <div class="border-t border-white/5 p-5 md:rounded-b-3xl bg-black/20">
      <button data-close-overlay class="w-full rounded-2xl bg-white/10 px-4 py-3.5 text-sm font-bold text-stone-100 transition hover:bg-white/20 active:scale-[0.98]">Done</button>

  <!-- Actions Modal (Tools) -->
  <section id="actionsModal" class="modal-layer fixed bottom-0 inset-x-0 md:inset-auto md:left-1/2 md:top-1/2 md:-translate-x-1/2 md:-translate-y-1/2 z-[75] hidden max-h-[90dvh] w-full md:w-[400px] flex-col rounded-t-[32px] md:rounded-3xl border border-white/10 bg-[#1c1917] shadow-2xl scale-in pb-safe md:pb-0" role="dialog" aria-modal="true" aria-labelledby="actionsTitle">
    <div class="flex items-center justify-between border-b border-white/5 px-6 py-5">
      <h2 id="actionsTitle" class="text-base font-bold text-stone-100">Document Tools</h2>
      <button data-close-overlay class="flex h-9 w-9 items-center justify-center rounded-full bg-white/5 text-stone-400 transition hover:bg-white/10 hover:text-white">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 6 12 12M18 6 6 18" stroke-width="2" stroke-linecap="round"/></svg>

      <button data-action="md" class="group flex flex-col items-center justify-center gap-2 rounded-2xl border border-white/5 bg-white/[0.03] p-4 transition hover:border-white/10 hover:bg-white/10">

      </button>
      
      <button data-action="doc" class="group flex flex-col items-center justify-center gap-2 rounded-2xl border border-white/5 bg-white/[0.03] p-4 transition hover:border-white/10 hover:bg-white/10">
        <div class="rounded-full bg-blue-500/10 p-3 text-blue-400 group-hover:bg-blue-500/20"><span class="mono text-sm font-bold">.DOC</span></div>
        <span class="text-xs font-semibold text-stone-300">MS Word</span>
      </button>
      
      <button data-action="print" class="group flex flex-col items-center justify-center gap-2 rounded-2xl border border-white/5 bg-white/[0.03] p-4 transition hover:border-white/10 hover:bg-white/10">
        <div class="rounded-full bg-amber-500/10 p-3 text-amber-400 group-hover:bg-amber-500/20"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 8V4h10v4M7 17H5a2 2 0 0 1-2-2v-5h18v5a2 2 0 0 1-2 2h-2M7 14h10v7H7v-7Z" stroke-width="2"/></svg></div>
        <span class="text-xs font-semibold text-stone-300">Print / PDF</span>
      </button>
      
      <button data-action="clear" class="group col-span-2 flex min-h-14 items-center justify-center gap-2 rounded-2xl border border-red-500/20 bg-red-500/5 p-3 text-red-400 transition hover:bg-red-500/15">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="text-sm font-bold">Clear Transcript</span>
      </button>
    </div>
  </section>

  <!-- Print Layout Wrapper -->
  <div id="printDocument">
    <h1 id="printTitle"></h1>
    <div id="printDate" class="print-date"></div>
    <div id="printBody" class="print-body"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const $ = (id) => document.getElementById(id);

      const ui = {
        transcript: $("transcript"), title: $("noteTitle"), record: $("recordButton"),
        micIcon: $("micIcon"), stopIcon: $("stopIcon"), micPulse: $("micPulse"), levelMeter: $("levelMeter"),
        statusDot: $("statusDot"), statusLabel: $("statusLabel"), recordHint: $("recordHint"),
        interimBubble: $("interimBubble"), interimText: $("interimText"), saveState: $("saveState"), saveIndicator: $("saveIndicator"),
        backdrop: $("backdrop"), settingsModal: $("settingsModal"), actionsModal: $("actionsModal"),
        savedNotesGrid: $("savedNotesGrid"), activeTagsContainer: $("activeTagsContainer"), tagInput: $("tagInput")
      };

      const defaultSettings = { continuous: true, commands: true, sound: true, haptic: true };
      let settings = { ...defaultSettings, ...loadJSON("vocalScribeSettings", {}) };
      
      let notes = loadJSON("vocalScribeNotes", []);
      if (!Array.isArray(notes)) notes = [];
      notes = notes.map(function (n) {
        if (!("tags" in n)) n.tags = [];
        return n;
      });
      
      let activeNoteId = null;
      let activeTags = []; // Tags for the currently edited note
      let saveTimer = null;
      let fontSize = 17;

      let notesFilterTag = "";

      // Recognition state
      let recognition = null;
      let wantsToListen = false;
      let recognitionRunning = false;
      let startPending = false;
      let restartTimer = null;
      let cycleId = 0;
      let handledFinalResults = new Set();
      let recentFinals = [];
      let audioStream = null;
      let audioContext = null;
      let analyser = null;
      let meterFrame = null;
      let fatalRecognitionError = false;
      let listeningSessionActive = false;
      let restartAttempts = 0;
      const MAX_RESTART_ATTEMPTS = 8;

      // Initialization
      applySettingsToUI();
      restoreDraft();
      renderActiveTags();
      renderNotes();
      updateStats();

      if (!SpeechRecognition) {
        ui.record.disabled = true;
        setStatus("Unsupported", "error");
        showToast("This browser does not provide the Web Speech Recognition API.", "error");
      } else {
        createRecognition();
      }

      // --- Helpers ---
      function loadJSON(key, fallback) {
        try {
          const value = JSON.parse(localStorage.getItem(key));
          return value ?? fallback;
        } catch { return fallback; }
      }

      function showToast(message, type = "info") {
        const toast = document.createElement("div");
        const color = type === "error" ? "border-red-500/30 bg-red-950/95 text-red-200" : type === "success" ? "border-emerald-500/30 bg-emerald-950/95 text-emerald-200" : "border-white/10 bg-[#1c1917]/95 text-stone-200";
        toast.className = `toast-in pointer-events-auto w-full rounded-2xl border px-5 py-3.5 text-sm font-semibold shadow-2xl backdrop-blur-xl ${color}`;
        toast.textContent = message;
        $("toastRegion").appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(-10px)";
          toast.style.transition = "200ms ease";
          setTimeout(() => toast.remove(), 200);
        }, 2800);
      }

      function setStatus(label, state = "ready") {
        if (state === "listening" || state === "starting") { ui.statusDot.classList.add("animate-pulse"); }
        else { ui.statusDot.classList.remove("animate-pulse"); }
        ui.statusLabel.textContent = label;
        const colors = {
          ready: "#10b981", // emerald
          listening: "#ef4444", // red
          starting: "#f59e0b", // amber
          error: "#ef4444"
        };
        ui.statusDot.style.background = colors[state] || colors.ready; 
      }

      function vibrate(pattern = 25) {
        if (settings.haptic && navigator.vibrate) navigator.vibrate(pattern);
      }

      function tone(frequency) {
        if (!settings.sound) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          const ctx = new Ctx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.frequency.value = frequency;
          oscillator.type = "sine";
          gain.gain.setValueAtTime(0.035, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.13);
          oscillator.connect(gain).connect(ctx.destination);
          oscillator.start();
          oscillator.stop(ctx.currentTime + 0.14);
          oscillator.onended = () => ctx.close();
        } catch {}
      }

      // --- Speech Recognition ---
      function createRecognition() {
        if (!SpeechRecognition) return;
        const engine = new SpeechRecognition();
        recognition = engine;
        engine.lang = $("languageSelect").value;
        engine.continuous = settings.continuous;
        engine.interimResults = true;
        engine.maxAlternatives = 1;

        engine.onstart = () => {
          if (recognition !== engine) { try { engine.abort(); } catch {} return; }
          startPending = false;
          recognitionRunning = true;
          if (!wantsToListen) { try { engine.stop(); } catch {} return; }
          fatalRecognitionError = false;
          restartAttempts = 0;
          cycleId += 1;
          handledFinalResults = new Set();
          setListeningUI(true);
          setStatus("Listening", "listening");
          if (!listeningSessionActive) {
            listeningSessionActive = true;
            tone(720);
            vibrate(35);
          }
        };

        engine.onresult = (event) => {
          if (recognition !== engine) return;
          const interimParts = [];
          for (let index = event.resultIndex; index < event.results.length; index += 1) {
            const result = event.results[index];
            const raw = (result[0]?.transcript || "").trim();
            if (!raw) continue;
            if (result.isFinal) {
              const resultKey = `${cycleId}:${index}`;
              if (handledFinalResults.has(resultKey)) continue;
              handledFinalResults.add(resultKey);
              commitFinalResult(raw);
            } else {
              interimParts.push(raw);
            }
          }
          const interim = interimParts.join(" ").trim();
          ui.interimText.textContent = interim;
          var wasHidden = ui.interimBubble.classList.contains("hidden"); 
          ui.interimBubble.classList.toggle("hidden", !interim); 
          if (interim && wasHidden) ui.interimBubble.classList.add("slide-up");
        };

        engine.onerror = (event) => {
          if (recognition !== engine) return;
          startPending = false;
          const error = event.error;
          if (error === "not-allowed" || error === "service-not-allowed") {
            fatalRecognitionError = true;
            wantsToListen = false;
            showToast("Microphone permission was blocked.", "error");
            setStatus("Mic blocked", "error");
          } else if (error === "audio-capture") {
            fatalRecognitionError = true;
            wantsToListen = false;
            showToast("No microphone input was found.", "error");
            setStatus("No microphone", "error");
          } else if (error === "network") {
            showToast("Speech recognition lost its network service.", "error");
          }
        };

        engine.onend = () => {
          if (recognition !== engine) return;
          recognitionRunning = false;
          startPending = false;
          ui.interimBubble.classList.add("hidden");

          if (wantsToListen && settings.continuous && !fatalRecognitionError) {
            restartAttempts += 1;
            if (restartAttempts > MAX_RESTART_ATTEMPTS) {
              wantsToListen = false;
              listeningSessionActive = false;
              setListeningUI(false);
              setStatus("Ready", "ready");
              stopLevelMeter();
              showToast("Continuous listening paused after repeated errors.", "error");
              return;
            }
            setStatus("Reconnecting", "starting");
            clearTimeout(restartTimer);
            restartTimer = setTimeout(startRecognitionCycle, 320);
          } else {
            wantsToListen = false;
            listeningSessionActive = false;
            setListeningUI(false);
            if (!fatalRecognitionError) setStatus("Ready", "ready");
            stopLevelMeter();
          }
        };
      }

      function commitFinalResult(raw) {
        const now = Date.now();
        const normalized = raw.toLocaleLowerCase().replace(/[\s.,!?;:'"\-—]+/g, " ").replace(/ {2,}/g, " ").trim();
        recentFinals = recentFinals.filter((item) => now - item.time < 8000);

        const isDuplicate = recentFinals.some((item) => {
          if (item.text !== normalized) return false;
          const age = now - item.time;
          return age < 2000 || (item.cycle !== cycleId && age < 12000);
        });
        if (isDuplicate) return;

        const subsumedByRecent = recentFinals.some((item) => {
          const age = now - item.time;
          if (age > 3500) return false;
          const itemNorm = item.text;
          if (itemNorm.length > normalized.length && itemNorm.includes(normalized)) return true;
          return false;
        });
        if (subsumedByRecent) return;

        recentFinals.push({ text: normalized, time: now, cycle: cycleId });

        const commandResult = settings.commands ? applySpokenCommands(raw) : { text: raw, stop: false, clear: false };
        if (commandResult.clear) {
          ui.transcript.value = "";
          onTranscriptChanged();
          showToast("Transcript cleared by voice command.");
          return;
        }
        if (commandResult.text) appendTranscript(commandResult.text);
        if (commandResult.stop) stopListening();
      }

      function applySpokenCommands(raw) {
        const exact = raw.toLocaleLowerCase().trim().replace(/[.!?]+$/, "");
        if (exact === "clear transcript" || exact === "clear transcription") return { text: "", clear: true, stop: false };
        if (exact === "stop listening" || exact === "stop recording") return { text: "", clear: false, stop: true };

        let text = raw;
        text = text.replace(/\bnew paragraph\b/gi, "\n\n");
        text = text.replace(/\bnew line\b/gi, "\n");
        text = text.replace(/\b(full stop|period)\b/gi, ".");
        text = text.replace(/\bcomma\b/gi, ",");
        text = text.replace(/\bquestion mark\b/gi, "?");
        text = text.replace(/\bexclamation (mark|point)\b/gi, "!");
        text = text.replace(/[ \t]+([,.!?])[ \t]*/g, "$1 ");
        text = text.replace(/[ \t]*\n[ \t]*/g, "\n");
        text = text.replace(/[ \t]{2,}/g, " ");
        text = text.replace(/^ +| +$/g, "");
        return { text, clear: false, stop: false };
      }

      function appendTranscript(incoming) {
        let current = ui.transcript.value;
        let text = incoming;

        const currentTrimmedEnd = current.replace(/\s+$/, "");
        const textTrimmed = text.replace(/^\s+|\s+$/g, "");
        
        if (textTrimmed && currentTrimmedEnd) {
          if (currentTrimmedEnd.endsWith(textTrimmed)) return;
          if (currentTrimmedEnd.toLocaleLowerCase().endsWith(textTrimmed.toLocaleLowerCase())) return;
          const recentFinalsTrimmed = recentFinals.map((item) => item.text);
          for (var ri = recentFinalsTrimmed.length - 1; ri >= 0; ri--) {
            var prev = recentFinalsTrimmed[ri];
            var prevLen = prev.length;
            var incomingLen = textTrimmed.toLocaleLowerCase().length;
            if (prevLen > 2 && prevLen < incomingLen && textTrimmed.toLocaleLowerCase().includes(prev)) {
              var currentLower = currentTrimmedEnd.toLocaleLowerCase();
              if (currentLower.endsWith(prev)) {
                current = currentTrimmedEnd.slice(0, currentTrimmedEnd.length - prevLen).replace(/\s+$/, "");
                var sep = current ? " " : "";
                if (/^[,.!?\n]/.test(text)) sep = "";
                ui.transcript.value = current + sep + text;
                ui.transcript.scrollTop = ui.transcript.scrollHeight;
                onTranscriptChanged();
                return;
              }
            }
          }
        }

        const isSentenceStart = !current.trim() || /[.!?]\s*$/.test(current) || /\n\s*$/.test(current);
        if (isSentenceStart && /^[a-z]/.test(text)) text = text.charAt(0).toUpperCase() + text.slice(1);

        let separator = " ";
        if (!current || /\s$/.test(current) || /^[,.!?\n]/.test(text)) separator = "";
        if (/^[,.!?]/.test(text)) current = current.replace(/\s+$/, "");

        ui.transcript.value = current + separator + text;
        ui.transcript.scrollTop = ui.transcript.scrollHeight;
        onTranscriptChanged();
      }

      async function startListening() {
        if (!SpeechRecognition || wantsToListen || recognitionRunning || startPending) return;
        wantsToListen = true;
        restartAttempts = 0;
        fatalRecognitionError = false;
        setStatus("Starting", "starting");
        ui.recordHint.textContent = "Starting...";

        await startLevelMeter();
        if (!wantsToListen) {
          stopLevelMeter();
          setListeningUI(false);
          return;
        }
        startRecognitionCycle();
      }

      function startRecognitionCycle() {
        if (!recognition || !wantsToListen || recognitionRunning || startPending) return;
        clearTimeout(restartTimer);
        startPending = true;
        try {
          recognition.lang = $("languageSelect").value;
          recognition.continuous = settings.continuous;
          recognition.start();
        } catch (error) {
          startPending = false;
          restartAttempts += 1;
          if (wantsToListen && restartAttempts <= MAX_RESTART_ATTEMPTS) {
            restartTimer = setTimeout(startRecognitionCycle, 450);
          } else if (wantsToListen) {
            wantsToListen = false;
            listeningSessionActive = false;
            setListeningUI(false);
            setStatus("Ready", "ready");
            stopLevelMeter();
            showToast("Unable to start speech recognition. Tap the mic to retry.", "error");
          }
        }
      }

      function stopListening(showMessage = true) {
        if (!wantsToListen && !recognitionRunning && !startPending) return;
        wantsToListen = false;
        restartAttempts = 0;
        clearTimeout(restartTimer);
        ui.interimBubble.classList.add("hidden");
        try { if (recognitionRunning || startPending) recognition.stop(); } catch {}
        recognitionRunning = false;
        startPending = false;
        listeningSessionActive = false;
        setListeningUI(false);
        setStatus("Ready", "ready");
        stopLevelMeter();
        tone(440);
        vibrate(20);
        if (showMessage) showToast("Listening stopped.");
      }

      function setListeningUI(listening) {
        ui.record.setAttribute("aria-pressed", String(listening));
        ui.record.setAttribute("aria-label", listening ? "Stop listening" : "Start listening");
        
        if(listening) {
            ui.record.classList.remove("bg-gradient-to-br", "from-amber-400", "to-orange-600", "border-[3px]");
            ui.record.classList.add("bg-red-500", "rec-glow", "border-0");
        } else {
            ui.record.classList.add("bg-gradient-to-br", "from-amber-400", "to-orange-600", "border-[3px]");
            ui.record.classList.remove("bg-red-500", "rec-glow", "border-0");
        }
        
        ui.micIcon.classList.toggle("hidden", listening);
        ui.stopIcon.classList.toggle("hidden", !listening);
        ui.micPulse.classList.toggle("hidden", !listening);
        ui.levelMeter.classList.toggle("opacity-0", !listening);
        ui.recordHint.textContent = listening ? "Listening…" : "Tap to speak";
        ui.recordHint.classList.toggle("text-red-400", listening);
      }

      async function startLevelMeter() {
        if (!navigator.mediaDevices?.getUserMedia) return;
        try {
          audioStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioContext = new Ctx();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 64;
          audioContext.createMediaStreamSource(audioStream).connect(analyser);
          drawMeter();
        } catch (error) {
          if (error?.name === "NotAllowedError") {
            wantsToListen = false;
            fatalRecognitionError = true;
            setListeningUI(false);
            setStatus("Mic blocked", "error");
            showToast("Microphone permission was denied.", "error");
          }
        }
      }

      function drawMeter() {
        if (!analyser) return;
        const data = new Uint8Array(analyser.frequencyBinCount);
        const bars = [...ui.levelMeter.children];
        const render = () => {
          if (!analyser) return;
          analyser.getByteFrequencyData(data);
          const average = data.reduce((sum, value) => sum + value, 0) / data.length;
          bars.forEach((bar, index) => {
            const variation = data[(index * 3) % data.length] || average;
            bar.style.height = `${Math.max(4, Math.min(24, 4 + variation / 8))}px`;
          });
          meterFrame = requestAnimationFrame(render);
        };
        render();
      }

      function stopLevelMeter() {
        cancelAnimationFrame(meterFrame);
        meterFrame = null;
        analyser = null;
        if (audioStream) audioStream.getTracks().forEach((track) => track.stop());
        audioStream = null;
        if (audioContext && audioContext.state !== "closed") audioContext.close().catch(() => {});
        audioContext = null;
        [...ui.levelMeter.children].forEach((bar, index) => bar.style.height = `${index % 2 ? 8 : 4}px`);
      }

      function restartRecognitionForLanguage() {
        const resume = wantsToListen;
        if (wantsToListen || recognitionRunning || startPending) stopListening(false);
        const oldEngine = recognition;
        recognition = null;
        try { if (oldEngine) oldEngine.abort(); } catch {}
        createRecognition();
        if (resume) setTimeout(startListening, 280);
      }

      function onTranscriptChanged() {
        try {
          updateStats();
          ui.saveState.textContent = "SAVING…";
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveDraft, 450);
        } catch (e) {}
      }

      function saveDraft() {
        const draft = { title: ui.title.value, text: ui.transcript.value, activeNoteId, tags: activeTags, updatedAt: Date.now() };
        try {
          localStorage.setItem("vocalScribeDraft", JSON.stringify(draft));
        } catch {
          ui.saveState.textContent = "UNSAVED";
          return;
        }
        ui.saveState.textContent = "SAVED"; 
        ui.saveIndicator.classList.remove("hidden"); 
        setTimeout(() => ui.saveIndicator.classList.add("hidden"), 1500);
      }

      function restoreDraft() {
        const draft = loadJSON("vocalScribeDraft", null);
        if (!draft) return;
        ui.title.value = typeof draft.title === "string" ? draft.title : "Untitled transcript";
        ui.transcript.value = typeof draft.text === "string" ? draft.text : "";
        activeNoteId = typeof draft.activeNoteId === "string" ? draft.activeNoteId : null;
        activeTags = Array.isArray(draft.tags) ? draft.tags : [];
      }

      function updateStats() {
        const text = ui.transcript.value;
        const trimmed = text.trim();
        const words = trimmed ? trimmed.split(/\s+/u).length : 0;
        const chars = text.length;
        const sentences = trimmed ? (trimmed.match(/[.!?]+(?=\s|$)/g) || []).length || 1 : 0;
        
        $("wordCount").textContent = words;
        $("charCount").textContent = chars;
        $("sentenceCount").textContent = sentences;
      }

      // --- Tags & Active Editor Logic ---
      function addTag(tag) {
        tag = tag.trim();
        if (!tag) return;
        if (!activeTags.includes(tag)) {
          activeTags.push(tag);
          renderActiveTags();
          onTranscriptChanged(); // triggers draft save
        }
      }
      
      function removeTag(tag) {
        activeTags = activeTags.filter(t => t !== tag);
        renderActiveTags();
        onTranscriptChanged();
      }

      function renderActiveTags() {
        ui.activeTagsContainer.replaceChildren();
        activeTags.forEach(tag => {
          const badge = document.createElement("div");
          badge.className = "inline-flex items-center gap-1.5 rounded-lg border border-amber-500/30 bg-amber-500/10 pl-2.5 pr-1 py-1 text-[11px] font-bold text-amber-400 shadow-sm";
          badge.innerHTML = `<span>${escapeHTML(tag)}</span> <button type="button" class="flex h-4 w-4 items-center justify-center rounded-md hover:bg-amber-500/20 hover:text-white transition-colors" aria-label="Remove tag">&times;</button>`;
          badge.querySelector('button').addEventListener('click', () => removeTag(tag));
          ui.activeTagsContainer.appendChild(badge);
        });
      }

      ui.tagInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === ",") {
          e.preventDefault();
          addTag(ui.tagInput.value);
          ui.tagInput.value = "";
        }
      });
      ui.tagInput.addEventListener("blur", () => {
        if (ui.tagInput.value) {
          addTag(ui.tagInput.value);
          ui.tagInput.value = "";
        }
      });

      // --- Saving & Data ---
      function saveNote() {
        const text = ui.transcript.value.trim();
        if (!text) return showToast("There is no transcript to save.", "error");
        const now = Date.now();
        const existingIndex = notes.findIndex((note) => note.id === activeNoteId);
        
        const note = {
          id: activeNoteId || window.crypto?.randomUUID?.() || String(now),
          title: ui.title.value.trim() || "Untitled transcript",
          text: ui.transcript.value,
          tags: [...activeTags],
          createdAt: existingIndex >= 0 ? notes[existingIndex].createdAt : now,
          updatedAt: now
        };
        
        activeNoteId = note.id;
        if (existingIndex >= 0) notes[existingIndex] = note;
        else notes.unshift(note);
        
        persistNotes();
        saveDraft();
        showToast("Note saved.", "success");
        vibrate(30);
      }

      function persistNotes() {
        try {
          localStorage.setItem("vocalScribeNotes", JSON.stringify(notes));
        } catch { showToast("Browser storage full.", "error"); }
        renderNotes();
      }

      function escapeHTML(str) {
        if (!str || typeof str !== "string") return "";
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function highlightMatches(text, query) {
        if (!query) return escapeHTML(text);
        var safe = escapeHTML(text);
        try {
          var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          var re = new RegExp("(" + escaped + ")", "gi");
          return safe.replace(re, "<mark class=\"rounded px-0.5 bg-amber-500/40 text-amber-100\">$1</mark>");
        } catch (e) { return safe; }
      }

      function loadNote(id) {
        const note = notes.find((item) => item.id === id);
        if (!note) return;
        stopListening(false);
        activeNoteId = note.id;
        ui.title.value = note.title;
        ui.transcript.value = note.text;
        activeTags = [...(note.tags || [])];
        
        renderActiveTags();
        onTranscriptChanged();
        
        // Scroll to editor beautifully
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast("Loaded for editing.");
      }

      function deleteNote(id) {
        var note = notes.find((item) => item.id === id);
        if (!note || !confirm(`Delete "${note.title}"?`)) return;
        notes = notes.filter((item) => item.id !== id);
        if (activeNoteId === id) {
          activeNoteId = null; // Detach from deleted note but keep text in editor
        }
        persistNotes();
        showToast("Note deleted.");
      }

      function copySavedNote(id) {
        var note = notes.find((item) => item.id === id);
        if (!note) return;
        try {
          if (navigator.clipboard?.writeText) {
             navigator.clipboard.writeText(note.text);
             showToast("Copied to clipboard.", "success");
          } else { throw new Error(); }
        } catch {
          showToast("Clipboard API unavailable.", "error");
        }
      }

      function renderActiveTagFilters() {
        var container = $("activeFilterTags");
        container.replaceChildren();
        var active = [];
        if (notesFilterTag) active.push(notesFilterTag);
        if (!active.length) { container.classList.add("hidden"); return; }
        container.classList.remove("hidden");
        active.forEach(tag => {
          var chip = document.createElement("span");
          chip.className = "inline-flex items-center gap-1 rounded-lg border border-amber-500/30 bg-amber-500/10 px-2.5 py-1 text-[11px] font-bold text-amber-400";
          chip.innerHTML = `${escapeHTML(tag)} <button class="ml-1 text-amber-500 hover:text-white" data-remove-tag>&times;</button>`;
          chip.querySelector("[data-remove-tag]").addEventListener("click", () => {
            notesFilterTag = ""; renderNotes();
          });
          container.appendChild(chip);
        });
      }

      function renderNotes() {
        try {
          var query = ($("notesSearch")?.value || "").trim().toLocaleLowerCase();
          
          var filtered = notes.filter(note => {
            if (notesFilterTag && !note.tags.some(t => t.toLocaleLowerCase() === notesFilterTag.toLocaleLowerCase())) return false;
            if (query && (note.title + " " + note.text).toLocaleLowerCase().indexOf(query) === -1) return false;
            return true;
          });

          // Sort default: Newest first
          filtered.sort((a,b) => b.updatedAt - a.updatedAt);

          ui.savedNotesGrid.replaceChildren();
          renderActiveTagFilters();

          if (!filtered.length) {
            var empty = document.createElement("div");
            empty.className = "col-span-full flex flex-col items-center justify-center p-12 text-center text-stone-500 border border-white/5 rounded-3xl bg-stone-900/20";
            empty.innerHTML = '<svg class="mb-4 h-12 w-12 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" stroke-width="1.5"/></svg><p class="text-base font-bold text-stone-400">' + (query || notesFilterTag ? "No notes match your filters" : "No saved notes yet") + '</p><p class="mt-2 text-sm leading-relaxed">' + (query || notesFilterTag ? "Try a different search." : "Transcripts you save will appear here as cards.") + '</p>';
            ui.savedNotesGrid.appendChild(empty);
            return;
          }

          var fragment = document.createDocumentFragment();
          filtered.forEach(rawNote => {
            try {
              var note = { ...rawNote, tags: rawNote.tags || [] };
              var card = document.createElement("article");
              // Modern Card Style
              card.className = "group flex flex-col rounded-3xl border border-white/5 bg-[#141210] p-6 transition-all hover:border-amber-500/20 hover:shadow-lg hover:shadow-amber-900/10";

              var header = document.createElement("div");
              header.className = "flex justify-between items-start gap-4 mb-3";
              
              var title = document.createElement("h3");
              title.className = "font-bold text-stone-100 text-lg line-clamp-1";
              title.innerHTML = highlightMatches(note.title, query);
              
              var date = document.createElement("span");
              date.className = "shrink-0 text-[10px] font-bold tracking-widest text-stone-600 uppercase mt-1";
              date.textContent = new Date(note.updatedAt).toLocaleDateString(undefined, {month:'short', day:'numeric'});

              header.append(title, date);
              
              var preview = document.createElement("p");
              preview.className = "text-sm text-stone-400 leading-relaxed line-clamp-3 mb-4 flex-1";
              preview.innerHTML = highlightMatches((note.text || "").replace(/\n/g, " "), query);

              var tagsRow = document.createElement("div");
              tagsRow.className = "flex flex-wrap gap-1.5 mb-5 min-h-[24px]";
              note.tags.forEach(tag => {
                var tagChip = document.createElement("span");
                tagChip.className = "cursor-pointer rounded-md border border-stone-800 bg-stone-900 px-2 py-0.5 text-[10px] font-bold text-stone-300 transition hover:bg-stone-800";
                tagChip.textContent = tag;
                tagChip.addEventListener("click", () => { notesFilterTag = tag; renderNotes(); });
                tagsRow.appendChild(tagChip);
              });

              var footerRow = document.createElement("div");
              footerRow.className = "flex items-center justify-between pt-4 border-t border-white/5 mt-auto";
              
              // Action Buttons for Card
              var actionsContainer = document.createElement("div");
              actionsContainer.className = "flex gap-2 w-full justify-between";

              // Left side actions (Copy)
              var leftActions = document.createElement("div");
              leftActions.className = "flex gap-2";

              var copyBtn = document.createElement("button");
              copyBtn.className = "flex h-8 w-8 items-center justify-center rounded-lg bg-white/5 text-stone-400 transition hover:bg-white/10 hover:text-white";
              copyBtn.title = "Copy";
              copyBtn.innerHTML = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
              copyBtn.addEventListener("click", () => copySavedNote(note.id));

              leftActions.appendChild(copyBtn);

              // Right side actions (Edit, Delete)
              var rightActions = document.createElement("div");
              rightActions.className = "flex gap-2";

              var editBtn = document.createElement("button");
              editBtn.className = "flex h-8 items-center gap-1.5 px-3 rounded-lg bg-amber-500/10 text-[11px] font-bold text-amber-500 transition hover:bg-amber-500/20";
              editBtn.innerHTML = '<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Edit';
              editBtn.addEventListener("click", () => loadNote(note.id));

              var delBtn = document.createElement("button");
              delBtn.className = "flex h-8 w-8 items-center justify-center rounded-lg bg-red-500/5 text-red-400 transition hover:bg-red-500/20 hover:text-red-300";
              delBtn.title = "Delete";
              delBtn.innerHTML = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
              delBtn.addEventListener("click", () => deleteNote(note.id));

              rightActions.append(editBtn, delBtn);
              
              actionsContainer.append(leftActions, rightActions);
              footerRow.appendChild(actionsContainer);

              card.append(header, preview, tagsRow, footerRow);
              fragment.appendChild(card);
            } catch (e) { /* skip */ }
          });
          ui.savedNotesGrid.appendChild(fragment);
        } catch (e) {}
      }

      function newNote() {
        if (ui.transcript.value.trim() && !confirm("Start a new transcript? Unsaved changes will become a draft.")) return;
        stopListening(false);
        activeNoteId = null;
        activeTags = [];
        ui.title.value = "Untitled transcript";
        ui.transcript.value = "";
        renderActiveTags();
        onTranscriptChanged();
        closeOverlays();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        ui.transcript.focus();
      }

      function openOverlay(element) {
        closeOverlays(false);
        ui.backdrop.classList.remove("hidden");
        void ui.backdrop.offsetWidth;
        ui.backdrop.classList.remove("opacity-0");
        element.classList.remove("hidden");
      }

      function closeOverlays(hideBackdrop = true) {
        ui.settingsModal.classList.add("hidden");
        ui.actionsModal.classList.add("hidden");
        $("findBar").classList.add("hidden");
        $("findBar").classList.remove("grid");
        
        if (hideBackdrop) {
          ui.backdrop.classList.add("opacity-0");
          setTimeout(() => ui.backdrop.classList.add("hidden"), 300);
        }
      }

      async function copyText() {
        if (!ui.transcript.value.trim()) return showToast("There is no transcript to copy.", "error");
        try {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard API unavailable");
          await navigator.clipboard.writeText(ui.transcript.value);
          showToast("Transcript copied.", "success");
        } catch {
          ui.transcript.select();
          document.execCommand("copy");
          showToast("Transcript copied.", "success");
        }
      }

      function cleanFillers() {
        const original = ui.transcript.value;
        if (!original.trim()) return showToast("There is no transcript to clean.", "error");
        const cleaned = original
          .replace(/\b(um+|uh+|erm+|ah+|like)\b[,.!?]?\s*/gi, "")
          .replace(/\b(you know|sort of|kind of|I mean|basically|literally|actually|you see|I guess)\b[,.!?]?\s*/gi, "")
          .replace(/ {2,}/g, " ")
          .replace(/\n +/g, "\n")
          .replace(/\n{3,}/g, "\n\n")
          .replace(/(^|[.!?]\s+)([a-z])/g, (_, start, letter) => start + letter.toUpperCase());
        if (cleaned === original) return showToast("No common filler words were found.");
        ui.transcript.value = cleaned;
        onTranscriptChanged();
        showToast("Common filler words removed.", "success");
      }

      function replaceAll() {
        const search = $("findInput").value;
        if (!search) return;
        const replacement = $("replaceInput").value;
        const escaped = search.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const regex = new RegExp(escaped, "gi");
        const matches = ui.transcript.value.match(regex);
        if (!matches) return showToast("No matches found.");
        ui.transcript.value = ui.transcript.value.replace(regex, replacement);
        onTranscriptChanged();
        showToast(`${matches.length} match${matches.length === 1 ? "" : "es"} replaced.`, "success");
      }

      function safeFilename() {
        return (ui.title.value.trim() || "transcript").replace(/[^a-z0-9-_]+/gi, "-").replace(/^-|-$/g, "").slice(0, 60) || "transcript";
      }

      function download(content, extension, type) {
        if (!ui.transcript.value.trim()) return showToast("There is no transcript to export.", "error");
        const url = URL.createObjectURL(new Blob([content], { type }));
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = `${safeFilename()}.${extension}`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }

      function exportDocument(format) {
        const title = ui.title.value.trim() || "Untitled transcript";
        const text = ui.transcript.value;
        if (format === "txt") download(text, "txt", "text/plain;charset=utf-8");
        if (format === "md") download(`# ${title}\n\n${text}\n`, "md", "text/markdown;charset=utf-8");
        if (format === "doc") {
          // Proper MS Word XML namespace injection for .doc export
          const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
          const safeTitle = title.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${safeTitle}</title></head><body><h1>${safeTitle}</h1><p>${escaped}</p></body></html>`;
          // \ufeff is the BOM for UTF-8
          const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = `${safeFilename()}.doc`;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 500);
        }
        closeOverlays();
      }

      function printTranscript() {
        if (!ui.transcript.value.trim()) return showToast("There is no transcript to print.", "error");
        $("printTitle").textContent = ui.title.value.trim() || "Untitled transcript";
        $("printDate").textContent = `Prepared ${new Date().toLocaleString()}`;
        $("printBody").textContent = ui.transcript.value;
        closeOverlays();
        window.print();
      }

      async function shareTranscript() {
        if (!ui.transcript.value.trim()) return showToast("There is no transcript to share.", "error");
        try {
          if (navigator.share) await navigator.share({ title: ui.title.value, text: ui.transcript.value });
          else if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(ui.transcript.value);
            showToast("Sharing is unavailable, so the transcript was copied.", "success");
          } else { await copyText(); }
        } catch (error) {
          if (error?.name !== "AbortError") showToast("Could not share the transcript.", "error");
        }
        closeOverlays();
      }

      function applySettingsToUI() {
        $("continuousSetting").checked = settings.continuous;
        $("commandsSetting").checked = settings.commands;
        $("soundSetting").checked = settings.sound;
        $("hapticSetting").checked = settings.haptic;
      }

      function saveSettingsFromUI() {
        const continuousChanged = settings.continuous !== $("continuousSetting").checked;
        settings = {
          continuous: $("continuousSetting").checked,
          commands: $("commandsSetting").checked,
          sound: $("soundSetting").checked,
          haptic: $("hapticSetting").checked
        };
        try { localStorage.setItem("vocalScribeSettings", JSON.stringify(settings)); } catch {}
        if (continuousChanged && recognition) recognition.continuous = settings.continuous;
      }

      // --- Event Listeners ---
      let recordClickLock = false;
      ui.record.addEventListener("click", () => {
        if (recordClickLock) return;
        recordClickLock = true;
        setTimeout(() => { recordClickLock = false; }, 350);
        if (wantsToListen || recognitionRunning || startPending) { stopListening(); } 
        else { startListening(); }
      });
      
      ui.transcript.addEventListener("input", onTranscriptChanged);
      ui.title.addEventListener("input", onTranscriptChanged);
      $("languageSelect").addEventListener("change", restartRecognitionForLanguage);
      $("saveButton").addEventListener("click", saveNote);
      $("settingsButton").addEventListener("click", () => openOverlay(ui.settingsModal));
      $("moreButton").addEventListener("click", () => openOverlay(ui.actionsModal));
      $("newNoteButton").addEventListener("click", newNote);
      $("notesSearch").addEventListener("input", renderNotes);
      
      ui.backdrop.addEventListener("click", () => {
        saveSettingsFromUI();
        closeOverlays();
      });
      document.querySelectorAll("[data-close-overlay]").forEach((button) => button.addEventListener("click", () => {
        saveSettingsFromUI();
        closeOverlays();
      }));

      $("findButton").addEventListener("click", () => {
        $("findBar").classList.remove("hidden");
        $("findBar").classList.add("grid");
        $("findInput").focus();
      });
      $("closeFindButton").addEventListener("click", () => {
        $("findBar").classList.add("hidden");
        $("findBar").classList.remove("grid");
      });
      $("replaceButton").addEventListener("click", replaceAll);
      $("cleanButton").addEventListener("click", cleanFillers);
      
      $("fontDownButton").addEventListener("click", () => {
        fontSize = Math.max(13, fontSize - 2);
        ui.transcript.style.fontSize = `${fontSize}px`;
      });
      $("fontUpButton").addEventListener("click", () => {
        fontSize = Math.min(34, fontSize + 2);
        ui.transcript.style.fontSize = `${fontSize}px`;
      });
      $("undoButton").addEventListener("click", () => { ui.transcript.focus(); document.execCommand("undo"); onTranscriptChanged(); });
      
      document.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", () => {
        const action = button.dataset.action;
        if (action === "copy") { copyText(); closeOverlays(); }
        else if (["txt", "md", "doc"].includes(action)) exportDocument(action);
        else if (action === "print") printTranscript();
        else if (action === "share") shareTranscript();
        else if (action === "clear") {
          if (ui.transcript.value && confirm("Clear the entire active transcript?")) {
            ui.transcript.value = "";
            activeTags = [];
            renderActiveTags();
            onTranscriptChanged();
            closeOverlays();
          }
        }
      }));

      document.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          ui.record.click();
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          saveNote();
        }
        if (event.key === "Escape") {
          saveSettingsFromUI();
          closeOverlays();
        }
      });

      window.addEventListener("beforeunload", () => {
        saveDraft();
        stopLevelMeter();
      });
    });
  </script>
</body>
</html>
