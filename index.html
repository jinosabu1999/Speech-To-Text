<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech-To-Text</title>
</head>
<body>
<script>
    class VoiceScribe {
        constructor() {
            this.recognition = null;
            this.isRecording = false;
            this.initializeSpeechRecognition();
            this.checkMicrophonePermission();
        }

        async checkMicrophonePermission() {
            if (!navigator.permissions) return;
            try {
                const permissionStatus = await navigator.permissions.query({ name: 'microphone' });
                if (permissionStatus.state === 'denied') {
                    this.showStatus('Mic permission denied', 'permission-denied');
                    this.showToast('Enable microphone in settings to use recording.', 'error');
                }
                permissionStatus.onchange = () => {
                    if (permissionStatus.state === 'denied') {
                        this.showStatus('Mic permission denied', 'permission-denied');
                    } else if (permissionStatus.state === 'granted') {
                        this.showStatus('Ready to record');
                    }
                };
            } catch (error) {
                console.error('Could not check microphone permission:', error);
            }
        }

        async toggleRecording() {
            if (!this.recognition) return;

            try {
                if (!this.isRecording) {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.recognition.lang = 'en-US';
                    this.recognition.start();
                    this.isRecording = true;
                } else {
                    this.recognition.stop();
                    this.isRecording = false;
                    this.showStatus('Recording stopped');
                }
            } catch (error) {
                this.showStatus('Microphone access denied', 'permission-denied');
                this.showToast('Please allow microphone access to use voice recording.', 'error');
            }
        }

        initializeSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                this.recognition = new SpeechRecognition();
                this.recognition.onstart = () => {
                    this.showStatus('Listening...', 'listening');
                };
                this.recognition.onend = () => {
                    this.showStatus('Ready to record');
                };
                this.recognition.onerror = (event) => {
                    if (event.error === 'not-allowed') {
                        this.showStatus('Permission Denied', 'permission-denied');
                        this.showToast('Speech recognition error: Microphone access not allowed.', 'error');
                    }
                };
            } else {
                this.showStatus('Speech recognition not supported', 'error');
            }
        }

        showStatus(message, type = '') {
            console.log(`[Status: ${type}] ${message}`);
        }

        showToast(message, type = '') {
            console.log(`[Toast: ${type}] ${message}`);
        }
    }

    new VoiceScribe();
</script>
</body>
</html>
